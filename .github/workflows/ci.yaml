name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'clusters/**'
      - 'bootstrap/**'
      - 'terraform/**'
      - '.github/workflows/**'
      - '.vscode/**'
      - 'scripts/**'
      - '.claude/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'renovate.json5'
      - '.pre-commit-config.yaml'
      # Renovate's only auto-bumped file lives here; without it that PR ran no CI at all.
      - '.kubernetes-version'
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'clusters/**'
      - 'bootstrap/**'
      - 'terraform/**'
      - '.github/workflows/**'
      - '.vscode/**'
      - 'scripts/**'
      - '.claude/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'renovate.json5'
      - '.pre-commit-config.yaml'
      # Renovate's only auto-bumped file lives here; without it that PR ran no CI at all.
      - '.kubernetes-version'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

env:
  # Derived from .kubernetes-version at runtime -- see the "Resolve Kubernetes version"
  # step in validate-changes. Hardcoding it here drifted to a full minor behind that
  # file (1.34.8 vs 1.33.12) because only one of the two is Renovate-managed.
  KUBERNETES_VERSION: ""
  RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_number }}
  TRIVY_CACHE_DIR: /tmp/trivy-cache

jobs:
  validate-changes:
    # timeout raised 5 → 10 after canary #964: first-run tool installs on a
    # fresh runner can exceed 5 minutes
    name: Validate Kubernetes Manifests
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.get-changed-files.outputs.changed }}
      changed_files: ${{ steps.get-changed-files.outputs.changed_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs unconditionally and needs no tooling or cluster access — it only
      # compares the namespace directories on disk to the README's structure
      # block. Deliberately a step inside this job rather than a job of its own,
      # so it blocks merges through the existing required check instead of
      # needing a new one added to branch protection.
      - name: Check README structure block
        run: ./scripts/check-readme-structure.sh

      # Single source of truth. .kubernetes-version is the file Renovate bumps, so
      # reading it here means CI's kubectl follows the version the upgrade PR proposes
      # instead of a separately-maintained constant that silently drifts.
      - name: Resolve Kubernetes version
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < .kubernetes-version)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::.kubernetes-version is not x.y.z: '$v'"; exit 1; }
          echo "KUBERNETES_VERSION=$v" >> "$GITHUB_ENV"
          echo "Kubernetes version from .kubernetes-version: $v"

      - name: Install kubectl
        run: |
          set -euo pipefail
          echo "📦 Installing kubectl..."
          KUBECTL_VERSION="v${{ env.KUBERNETES_VERSION }}"
          
          # Try multiple methods to install kubectl
          if command -v kubectl >/dev/null 2>&1; then
            echo "✅ kubectl already installed"
            kubectl version --client
          else
            echo "🔄 Downloading kubectl..."
            # Try with retries and different mirrors
            for i in {1..3}; do
              if curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"; then
                echo "✅ kubectl downloaded successfully"
                break
              else
                echo "⚠️ Attempt $i failed, retrying..."
                sleep 2
              fi
            done
            
            if [[ ! -f kubectl ]]; then
              echo "❌ Failed to download kubectl after 3 attempts"
              exit 1
            fi
            
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
            kubectl version --client
          fi

      - name: Install yq
        run: |
          set -euo pipefail
          echo "📦 Installing yq..."
          sudo curl -L -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Get changed files
        id: get-changed-files
        run: |
          set -euo pipefail
          echo "🔍 Finding changed files..."
          
          # Determine the base ref for comparison
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs, compare against the base branch (e.g., main)
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "📋 PR Mode: Comparing $HEAD_SHA against base $BASE_SHA"
          else
            # For pushes, use the before SHA
            BASE_SHA="${{ github.event.before }}"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              # First push to branch or force push - compare against HEAD~1
              BASE_SHA="HEAD~1"
            fi
            HEAD_SHA="HEAD"
            echo "📋 Push Mode: Comparing $HEAD_SHA against $BASE_SHA"
          fi
          
          # All changed YAML files, then scoped subsets
          CHANGED_YAML=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '\.(yaml|yml)$' || echo "")

          # Lint scope: clusters/ + bootstrap/ (bootstrap is in the workflow
          # triggers but was previously filtered out and never validated)
          LINT_FILES=$(printf '%s\n' "$CHANGED_YAML" | grep -E '^(clusters|bootstrap)/' || echo "")

          # Deploy scope: clusters/ only
          DIRECT_FILES=$(printf '%s\n' "$CHANGED_YAML" | grep '^clusters/' || echo "")

          echo "🔍 All changed files in this PR/push:"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true

          # Expand each changed file to its full app unit (the .../app/ directory).
          # A HelmRelease renders together with its sibling values ConfigMap, so
          # changing one without the other must still test the pair (PR #960: a
          # configmap.yaml-only change broke the Harbor Helm upgrade untested).
          EXPANDED=""
          if [[ -n "$DIRECT_FILES" ]]; then
            EXPANDED=$(
              printf '%s\n' "$DIRECT_FILES" | while IFS= read -r f; do
                echo "$f"
                if [[ "$f" == */app/* ]]; then
                  UNIT="${f%%/app/*}/app"
                  [[ -d "$UNIT" ]] && find "$UNIT" -maxdepth 1 \( -name '*.yaml' -o -name '*.yml' \)
                fi
              done | sort -u
            )
          fi

          # Pull in the source repository file for any HelmRelease in scope, so
          # the chart source can be validated even when only the HR changed
          REPO_FILES=""
          if [[ -n "$EXPANDED" ]]; then
            REPO_FILES=$(
              printf '%s\n' "$EXPANDED" | while IFS= read -r f; do
                [[ -f "$f" ]] || continue
                yq eval '.kind' "$f" 2>/dev/null | grep -qi '^HelmRelease$' || continue
                SRC_NAME=$(yq eval '.spec.chartRef.name // .spec.chart.spec.sourceRef.name // ""' "$f")
                [[ -n "$SRC_NAME" ]] || continue
                for rf in clusters/vollminlab-cluster/flux-system/repositories/*.yaml; do
                  if [[ "$(yq eval '.metadata.name' "$rf" 2>/dev/null)" == "$SRC_NAME" ]]; then
                    echo "$rf"
                  fi
                done
              done | sort -u
            )
          fi

          CHANGED_FILES=$(printf '%s\n%s\n' "$EXPANDED" "$REPO_FILES" | sed '/^$/d' | sort -u)

          echo ""
          echo "🔍 Files in validation scope (changed + app-unit closure):"
          if [[ -n "$CHANGED_FILES" ]]; then
            printf '%s\n' "$CHANGED_FILES"
          else
            echo "(none)"
          fi

          {
            echo "LINT_FILES<<EOF"
            printf '%s\n' "$LINT_FILES"
            echo "EOF"
          } >> $GITHUB_ENV

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "✅ No YAML files changed in clusters directory"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "CHANGED_FILES=" >> $GITHUB_ENV
          else
            echo "📋 Found changed cluster files - will run deployment validation"
            echo "changed=true" >> $GITHUB_OUTPUT
            {
              echo "changed_files<<EOF"
              printf '%s\n' "$CHANGED_FILES"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            {
              echo "CHANGED_FILES<<EOF"
              printf '%s\n' "$CHANGED_FILES"
              echo "EOF"
            } >> $GITHUB_ENV
          fi

      - name: Validate YAML syntax
        if: env.LINT_FILES != ''
        run: |
          set -euo pipefail
          echo "🔍 Validating YAML syntax with yamllint..."

          # ARC runners are ephemeral pods — nothing persists between runs, so
          # yamllint must be installed every time. apt-get hung after fetching
          # package lists on two consecutive runs (canary PR #964), eating the
          # whole job timeout, so install via pip instead. The runner image
          # ships python3 without pip/ensurepip, hence the get-pip bootstrap.
          # timeout guards make a hung download fail fast instead of stalling
          # the job to its timeout.
          timeout 90 curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          timeout 90 python3 /tmp/get-pip.py --user --break-system-packages --quiet
          timeout 90 python3 -m pip install --user --break-system-packages --quiet yamllint
          export PATH="$HOME/.local/bin:$PATH"
          yamllint --version

          # Create yamllint config for Kubernetes files
          cat > .yamllint << 'EOF'
          extends: default

          rules:
            document-start:
              present: false
            new-line-at-end-of-file:
              level: warning
            line-length:
              max: 200
            truthy:
              allowed-values: ['true', 'false', 'on', 'off']
          EOF

          # Lint every changed YAML file in clusters/ + bootstrap/
          printf '%s\n' "$LINT_FILES" | while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              # gotk-components.yaml is generated by flux (DO NOT EDIT) and uses
              # block-sequence indentation that yamllint rejects — skip it.
              if [[ "$file" == *"gotk-components.yaml" ]]; then
                echo "  Skipping generated file: $file"
                continue
              fi

              echo "Validating: $file"
              yamllint "$file" || {
                echo "❌ YAML lint error in $file"
                exit 1
              }
            fi
          done

          echo "✅ All YAML files have valid syntax"

      - name: Validate Kubernetes schemas
        if: env.LINT_FILES != ''
        run: |
          set -euo pipefail
          echo "🔍 Validating Kubernetes schemas with kubeconform..."

          # Install kubeconform
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xvzf -
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

          # Validate each changed Kubernetes file. CRD schemas (Flux, Kyverno,
          # cert-manager, ESO, etc.) come from the datreeio CRDs-catalog — these
          # kinds were previously skipped entirely and never schema-checked.
          printf '%s\n' "$LINT_FILES" | while IFS= read -r file; do
            if [[ -f "$file" ]] && grep -q "kind:" "$file" && grep -q "apiVersion:" "$file"; then
              echo "Validating schema for CHANGED file: $file"
              timeout 30s kubeconform -strict -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -summary "$file" || {
                EXIT_CODE=$?
                if [[ $EXIT_CODE -eq 124 ]]; then
                  echo "❌ Kubernetes schema validation TIMED OUT for CHANGED file: $file (exceeded 30s)"
                else
                  echo "❌ Kubernetes schema validation failed for CHANGED file: $file"
                fi
                exit 1
              }
            fi
          done

          echo "✅ All Kubernetes resources have valid schemas"

      - name: Scan for secrets (fast file-content check)
        if: env.LINT_FILES != '' || env.CHANGED_FILES != ''
        run: |
          set -euo pipefail
          echo "🔍 Scanning changed files for secrets..."

          # Install gitleaks
          curl -sL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            LOG_OPTS="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              BEFORE="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            LOG_OPTS="$BEFORE..${{ github.sha }}"
          fi

          cat > .gitleaks.toml << 'GITLEAKS_CFG'
          [extend]
          useDefault = true

          [allowlist]
          description = "Allow certificates and public keys"
          regexes = [
            '''-----BEGIN CERTIFICATE-----''',
            '''-----BEGIN PUBLIC KEY-----'''
          ]
          # K8s secretKeyRef key names that match generic-api-key pattern but are not secrets
          stopwords = [
            "B2_APPLICATION_KEY_ID",
            "B2_APPLICATION_KEY"
          ]
          GITLEAKS_CFG

          gitleaks detect \
            --config .gitleaks.toml \
            --log-opts "$LOG_OPTS" \
            --no-banner \
            --exit-code 1 || {
              echo "❌ Secrets detected. Never commit plain API keys or passwords."
              echo "Use ExternalSecrets (ESO + 1Password); store credentials in 1Password."
              exit 1
            }

          echo "✅ No secrets detected in changed files"

  integration-test:
    name: Integration Test
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    # The only job that talks to the live cluster, and the only one that had no
    # timeout -- so a hung kubectl against a stalled apiserver would have held a
    # self-hosted runner for the 360-minute default. 20m is ~65x its typical 18s.
    timeout-minutes: 20
    needs: [validate-changes]
    if: needs.validate-changes.result == 'success'
    env:
      CHANGED_FILES: ${{ needs.validate-changes.outputs.changed_files }}
      # This is the only job that talks to the live cluster. In break-glass mode
      # (CI_RUNNER set to a GitHub-hosted runner because the self-hosted runners
      # are down) there is no kubeconfig, so every step below is skipped and the
      # job reports success — a required check that can never run is what creates
      # the deadlock this fallback exists to break.
      CLUSTER_CI: ${{ (vars.CI_RUNNER || 'vollminlab') == 'vollminlab' }}
    steps:
      - name: Warn when cluster validation is skipped
        if: env.CLUSTER_CI != 'true'
        run: |
          echo "::warning title=Cluster validation skipped::CI_RUNNER is set to '${{ vars.CI_RUNNER }}' (break-glass mode). Server-side dry-run against the live cluster did NOT run. Unset the CI_RUNNER repo variable once the self-hosted runners are healthy, then re-run this workflow."

      - name: Skip when no cluster files changed
        if: env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed != 'true'
        run: echo "No cluster YAML changed; job succeeds." && exit 0
      - name: Checkout code
        if: env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Single source of truth. .kubernetes-version is the file Renovate bumps, so
      # reading it here means CI's kubectl follows the version the upgrade PR proposes
      # instead of a separately-maintained constant that silently drifts.
      - name: Resolve Kubernetes version
        if: env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < .kubernetes-version)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::.kubernetes-version is not x.y.z: '$v'"; exit 1; }
          echo "KUBERNETES_VERSION=$v" >> "$GITHUB_ENV"
          echo "Kubernetes version from .kubernetes-version: $v"

      - name: Setup kubectl
        if: env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          KUBECTL_VERSION="v${{ env.KUBERNETES_VERSION }}"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install yq
        if: env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "📦 Installing yq..."
          sudo curl -L -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install Helm
        if: env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "📦 Installing Helm..."
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Create test namespace
        if: env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          TEST_NAMESPACE="ci-test-${{ env.RUN_SUFFIX }}"
          echo "TEST_NAMESPACE=$TEST_NAMESPACE" >> $GITHUB_ENV

          # Namespaced objects are dry-run applied INTO this namespace, so it must
          # exist first. Kyverno mutate policies do apiCall lookups on namespace
          # labels — an unlabeled namespace fails the fail-closed webhook — and the
          # runner ServiceAccount can create/delete namespaces but not patch them,
          # so the labels must be set at creation time.
          kubectl create -f - <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: $TEST_NAMESPACE
            labels:
              app: ci-test
              env: production
              category: core
          EOF
          echo "✅ Created test namespace: $TEST_NAMESPACE"

      - name: Render charts and server-side dry-run
        if: env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "🔍 Rendering changed HelmReleases and validating them against the live API server..."
          # This reproduces what helm-controller does before applying: render the
          # chart with the real values, parse the output strictly, then submit it
          # to the API server with --dry-run=server. Dry-run exercises the FULL
          # admission chain (OpenAPI/CRD schema + every Kyverno policy; pod-level
          # policies fire via autogen on the workload template) but SCHEDULES NO
          # POD and PERSISTS NOTHING. Consequences:
          #   • Absent ESO Secrets are irrelevant — no pod is started, so no
          #     CreateContainerConfigError, no readiness wait to time out.
          #   • Cluster-scoped objects cannot clobber production — nothing is
          #     written, so the #972 / #981 incident class is structurally gone.
          # PR #960 (duplicate 'app' key in exporter.podLabels) is caught by the
          # strict parse below, before the dry-run.

          # kustomize's strict go-yaml parser rejects duplicate mapping keys with
          # the same error helm-controller reports; helm template alone does not.
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize

          REPO_DIR="clusters/vollminlab-cluster/flux-system/repositories"
          HARBOR_LOGIN_DONE=""
          RENDER_FAILED=0

          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            [[ "$(yq eval '.kind' "$file" 2>/dev/null)" == "HelmRelease" ]] || continue

            RELEASE_NAME=$(yq eval '.metadata.name' "$file")
            APP_DIR=$(dirname "$file")
            SRC_NAME=$(yq eval '.spec.chartRef.name // .spec.chart.spec.sourceRef.name // ""' "$file")
            if [[ -z "$SRC_NAME" ]]; then
              echo "❌ $file: no chartRef.name or chart.spec.sourceRef.name"
              RENDER_FAILED=1
              continue
            fi

            # Locate the source repository file by metadata.name
            SRC_FILE=""
            for rf in "$REPO_DIR"/*.yaml; do
              if [[ "$(yq eval '.metadata.name' "$rf" 2>/dev/null)" == "$SRC_NAME" ]]; then
                SRC_FILE="$rf"
                break
              fi
            done
            if [[ -z "$SRC_FILE" ]]; then
              echo "❌ $file: source '$SRC_NAME' not found in $REPO_DIR"
              RENDER_FAILED=1
              continue
            fi
            SRC_KIND=$(yq eval '.kind' "$SRC_FILE")
            SRC_URL=$(yq eval '.spec.url' "$SRC_FILE")

            # Collect values files from valuesFrom (ConfigMaps only — Secret
            # values live in the cluster, not the repo; skip with a warning)
            VALUES_ARGS=()
            VF_COUNT=$(yq eval '.spec.valuesFrom | length' "$file")
            [[ "$VF_COUNT" == "null" ]] && VF_COUNT=0
            for ((i=0; i<VF_COUNT; i++)); do
              VF_KIND=$(yq eval ".spec.valuesFrom[$i].kind" "$file")
              VF_NAME=$(yq eval ".spec.valuesFrom[$i].name" "$file")
              VF_KEY=$(yq eval ".spec.valuesFrom[$i].valuesKey // \"values.yaml\"" "$file")
              VF_TARGET=$(yq eval ".spec.valuesFrom[$i].targetPath // \"\"" "$file")
              if [[ "$VF_KIND" != "ConfigMap" ]]; then
                echo "  ⚠️ $RELEASE_NAME: skipping valuesFrom $VF_KIND/$VF_NAME (not in repo)"
                continue
              fi
              if [[ -n "$VF_TARGET" ]]; then
                echo "  ⚠️ $RELEASE_NAME: skipping valuesFrom $VF_NAME (targetPath not supported statically)"
                continue
              fi
              CM_FILE=""
              for cf in "$APP_DIR"/*.yaml; do
                if [[ "$(yq eval '.kind' "$cf" 2>/dev/null)" == "ConfigMap" ]] && \
                   [[ "$(yq eval '.metadata.name' "$cf" 2>/dev/null)" == "$VF_NAME" ]]; then
                  CM_FILE="$cf"
                  break
                fi
              done
              if [[ -z "$CM_FILE" ]]; then
                echo "  ⚠️ $RELEASE_NAME: ConfigMap $VF_NAME not found in $APP_DIR — rendering without it"
                continue
              fi
              VF_TMP=$(mktemp)
              yq eval ".data[\"$VF_KEY\"]" "$CM_FILE" > "$VF_TMP"
              VALUES_ARGS+=(-f "$VF_TMP")
            done

            # Harbor OCI login once if needed
            if [[ "$SRC_URL" == oci://harbor.vollminlab.com* && -z "$HARBOR_LOGIN_DONE" ]]; then
              echo "$HARBOR_PASSWORD" | helm registry login harbor.vollminlab.com \
                -u "$HARBOR_USERNAME" --password-stdin
              HARBOR_LOGIN_DONE=1
            fi

            # Render with --namespace $TEST_NAMESPACE so charts that template
            # `namespace: {{ .Release.Namespace }}` emit ci-test — matching the
            # dry-run target below (otherwise kubectl errors on a namespace
            # mismatch against the default "default").
            RENDER_DIR=$(mktemp -d)
            echo "  Rendering $RELEASE_NAME (source: $SRC_KIND/$SRC_NAME)..."
            RENDER_OK=1
            if [[ "$SRC_KIND" == "OCIRepository" ]]; then
              CHART_VERSION=$(yq eval '.spec.ref.tag' "$SRC_FILE")
              helm template "$RELEASE_NAME" "$SRC_URL" --version "$CHART_VERSION" \
                --namespace "$TEST_NAMESPACE" \
                ${VALUES_ARGS[@]+"${VALUES_ARGS[@]}"} > "$RENDER_DIR/rendered.yaml" || RENDER_OK=0
            else
              CHART_NAME=$(yq eval '.spec.chart.spec.chart' "$file")
              CHART_VERSION=$(yq eval '.spec.chart.spec.version' "$file")
              if [[ "$SRC_URL" == oci://* ]]; then
                helm template "$RELEASE_NAME" "${SRC_URL}/${CHART_NAME}" --version "$CHART_VERSION" \
                  --namespace "$TEST_NAMESPACE" \
                  ${VALUES_ARGS[@]+"${VALUES_ARGS[@]}"} > "$RENDER_DIR/rendered.yaml" || RENDER_OK=0
              else
                helm template "$RELEASE_NAME" "$CHART_NAME" --repo "$SRC_URL" --version "$CHART_VERSION" \
                  --namespace "$TEST_NAMESPACE" \
                  ${VALUES_ARGS[@]+"${VALUES_ARGS[@]}"} > "$RENDER_DIR/rendered.yaml" || RENDER_OK=0
              fi
            fi
            if [[ "$RENDER_OK" == "0" ]]; then
              echo "❌ helm template failed for $RELEASE_NAME ($file)"
              RENDER_FAILED=1
              continue
            fi

            # Strict-parse the rendered output the way helm-controller does.
            printf 'resources:\n  - rendered.yaml\n' > "$RENDER_DIR/kustomization.yaml"
            if ! kustomize build "$RENDER_DIR" > /dev/null; then
              echo "❌ Rendered output of $RELEASE_NAME fails strict YAML parsing."
              echo "   This is the failure mode of PR #960 (duplicate mapping key) —"
              echo "   the in-cluster Helm upgrade would fail exactly like this."
              RENDER_FAILED=1
              continue
            fi
            echo "  ✅ $RELEASE_NAME renders and strict-parses cleanly"

            # ── Server-side dry-run: real admission chain, zero side effects ────
            if kubectl apply --dry-run=server -n "$TEST_NAMESPACE" \
                 -f "$RENDER_DIR/rendered.yaml" > "$RENDER_DIR/dryrun.out" 2>&1; then
              echo "  ✅ $RELEASE_NAME passes server-side dry-run (schema + Kyverno admission)"
            else
              # Two failure classes are NOT manifest defects and are downgraded
              # to warnings so a valid chart is never falsely failed:
              #   1. Missing-CRD ordering — a chart that bundles a CRD and a CR
              #      using it; Flux installs CRDs before CRs in the real reconcile.
              #   2. RBAC forbidden / namespace mismatch — the CI ServiceAccount
              #      lacks create/patch on that kind (e.g. cluster-scoped objects),
              #      or the chart hardcodes a fixed namespace. A dry-run uses the
              #      same verbs as a real write, so this is a CI-identity/target
              #      limit, not a problem with the manifest.
              # Everything else (Kyverno "denied the request", schema "invalid",
              # unknown fields) is a real rejection and fails the job.
              #
              # kubectl's "retrieving current configuration" GET-before-patch step
              # (needed for the 3-way merge on every update) prints its own generic
              # wrapper line ("Error from server (Forbidden): error when retrieving
              # current configuration of:") before the actual forbidden reason on a
              # later line. That wrapper line matches the positive filter above but
              # contains none of the RBAC-forbidden phrases below it, so it must be
              # excluded here too — otherwise any chart with RBAC objects (ClusterRole,
              # RoleBinding, webhook configs, etc.) always false-fails.
              DRYRUN_ERRORS=$(grep -iE 'error|denied|invalid|forbidden|must |required|not allowed' "$RENDER_DIR/dryrun.out" 2>/dev/null \
                | grep -ivE 'unable to recognize|no matches for kind|ensure CRDs are installed|is forbidden|cannot (create|patch|get|update|delete) resource|forbidden: User|does not match the namespace|error when retrieving current configuration' \
                || true)
              if [[ -n "$DRYRUN_ERRORS" ]]; then
                echo "❌ $RELEASE_NAME rejected by server-side dry-run:"
                cat "$RENDER_DIR/dryrun.out"
                RENDER_FAILED=1
              else
                echo "  ⚠️ $RELEASE_NAME: dry-run reported only benign missing-CRD / RBAC-identity issues, continuing:"
                cat "$RENDER_DIR/dryrun.out"
              fi
            fi
          done <<< "$CHANGED_FILES"

          if [[ "$RENDER_FAILED" != "0" ]]; then
            echo "❌ One or more HelmReleases failed render / strict-parse / dry-run validation"
            exit 1
          fi
          echo "✅ All changed HelmReleases render, strict-parse, and pass server-side dry-run"

      - name: Cleanup test namespace and sweep leaked objects
        if: always() && env.CLUSTER_CI == 'true' && needs.validate-changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          # ⚠️ `set +e` IS LOAD-BEARING — DO NOT REMOVE IT.
          # GitHub runs every `run:` step as `bash --noprofile --norc -e -o pipefail`.
          # A script's own `set -uo pipefail` does NOT cancel that injected `-e`;
          # only `set +e` does. The previous version of this step relied on that
          # mistaken assumption: the sweep's `kubectl get <kinds>` exited 1 (the
          # runner SA cannot list clusterrole/role — verified, see below), pipefail
          # propagated the failure, and `-e` killed the step BEFORE the namespace
          # delete ever ran. `continue-on-error` hid it, so CI stayed green while
          # 110 ci-test namespaces piled up over 12 days.
          set +e
          set -u
          TEST_NAMESPACE="${TEST_NAMESPACE:-}"
          [[ -z "$TEST_NAMESPACE" ]] && { echo "No test namespace to clean up."; exit 0; }

          # Namespace delete goes FIRST. It is the cleanup that actually matters —
          # nothing below it may ever be able to prevent it from running.
          echo "🧹 Cleaning up test namespace..."
          if kubectl delete namespace "$TEST_NAMESPACE" --ignore-not-found=true; then
            echo "✅ Cleaned up test namespace: $TEST_NAMESPACE"
          else
            echo "⚠️ Failed to delete namespace — $TEST_NAMESPACE may need manual cleanup"
          fi

          # The dry-run validation above persists nothing, so in normal operation
          # deleting the ephemeral namespace is all that is needed. But a live-install
          # regression (as the pre-#986 CI did) can leak Helm objects OUTSIDE this
          # namespace that `delete namespace` never reaps. On 2026-07-25 exactly this
          # left a second rebalancing controller running for days, double-moving
          # Longhorn replicas. Belt-and-suspenders: sweep every Helm-managed object
          # whose release-namespace annotation is THIS run's ci-test namespace. Keyed
          # on the unique per-run namespace, so it can never match a production release.
          #
          # Only kinds the runner SA can actually list are swept. Cluster-scoped kinds
          # (clusterrole, clusterrolebinding, *webhookconfiguration) and role/rolebinding
          # are `list=no` for system:serviceaccount:actions-runner-system:github-actions-runner,
          # so including them was pure breakage — it never detected anything, it only
          # made the step exit non-zero. A cluster-scoped leak is instead prevented at
          # source: CI renders and dry-runs, it never live-installs (#986/#989).
          echo "🧹 Sweeping any Helm objects leaked from $TEST_NAMESPACE..."
          NS_KINDS="deployment,statefulset,daemonset,serviceaccount,configmap,service"

          # Emit "<kind>\t<name>\t<namespace>" for objects whose Helm release-namespace
          # annotation matches this run's ci-test namespace.
          # One-liner so no flush-left line terminates the YAML block scalar.
          select_leaked() {
            python3 -c "import json,sys; ns=sys.argv[1]; d=json.load(sys.stdin); [print(o.get('kind','')+'\t'+o['metadata'].get('name','')+'\t'+(o['metadata'].get('namespace') or '')) for o in d.get('items',[]) if (o['metadata'].get('annotations') or {}).get('meta.helm.sh/release-namespace')==ns]" "$TEST_NAMESPACE" 2>/dev/null
          }

          kubectl get $NS_KINDS -A -l app.kubernetes.io/managed-by=Helm -o json 2>/dev/null \
            | select_leaked \
            | while IFS=$'\t' read -r kind name ons; do
                [[ -z "$kind" || -z "$name" || -z "$ons" ]] && continue
                echo "  🗑️  $kind/$name (ns $ons) — leaked, deleting"
                kubectl delete "$kind" "$name" -n "$ons" --ignore-not-found=true
              done
          echo "✅ Sweep complete"

  security-scan:
    name: Security Scan
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    needs: [validate-changes]
    if: needs.validate-changes.result == 'success'
    timeout-minutes: 15
    # Trivy is informational (uploads to GitHub Security tab). Hard gates are
    # gitleaks (secret-scanning workflow) and Kyverno (policy-validation job).
    # Infrastructure timeouts should not block merges.
    continue-on-error: true
    steps:
      - name: Skip when no cluster files changed
        if: needs.validate-changes.outputs.changed != 'true'
        run: echo "No cluster YAML changed; job succeeds." && exit 0
      - name: Checkout code
        if: needs.validate-changes.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Trivy
        if: needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "📦 Installing Trivy..."
          
          # Check if Trivy is already installed
          if command -v trivy >/dev/null 2>&1; then
            echo "✅ Trivy already installed"
            trivy --version
          else
            echo "🔄 Downloading Trivy..."
            # Try with retries
            for i in {1..3}; do
              if curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b ~/.local/bin; then
                echo "✅ Trivy installed successfully"
                break
              else
                echo "⚠️ Attempt $i failed, retrying..."
                sleep 2
              fi
            done
            
            if [[ ! -f ~/.local/bin/trivy ]]; then
              echo "❌ Failed to install Trivy after 3 attempts"
              exit 1
            fi
            
            echo "$HOME/.local/bin" >> $GITHUB_PATH
            ~/.local/bin/trivy --version
          fi

      - name: Prepare Trivy cache
        if: needs.validate-changes.outputs.changed == 'true'
        run: mkdir -p "${{ env.TRIVY_CACHE_DIR }}"

      - name: Get changed files for security scan
        if: needs.validate-changes.outputs.changed == 'true'
        id: changed-files-security
        run: |
          set -euo pipefail
          echo "🔍 Determining files to scan for security vulnerabilities..."
          
          # Get range for diff
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            RANGE="$BASE_SHA..HEAD"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ -z "$BASE_SHA" ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            RANGE="$BASE_SHA..HEAD"
          fi
          
          # Get changed files that are relevant for security scanning
          CHANGED_FILES=$(git diff --name-only "$RANGE" | grep -E '\.(yaml|yml|json|tf|hcl|dockerfile|Dockerfile)$|^clusters/' | head -20 || true)
          
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No security-relevant files changed, skipping detailed scan"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Security-relevant files changed:"
          echo "$CHANGED_FILES"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run optimized Trivy scans
        if: steps.changed-files-security.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "🔍 Running optimized Trivy scans with 60-second timeout..."
          
          # Create scan directory with only changed files
          SCAN_DIR=$(mktemp -d)
          echo "${{ steps.changed-files-security.outputs.files }}" | while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              # Create directory structure and copy file
              mkdir -p "$SCAN_DIR/$(dirname "$file")"
              cp "$file" "$SCAN_DIR/$file"
            fi
          done
          
          # Run filesystem scan on changed files only
          echo "Running filesystem scan on changed files..."
          timeout 120 trivy fs \
            --format sarif \
            --output trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --cache-dir "${{ env.TRIVY_CACHE_DIR }}" \
            --skip-files "*.log,*.tmp,*.cache,node_modules/*,.git/*" \
            --timeout 60s \
            "$SCAN_DIR" || {
            echo "⚠️ Trivy filesystem scan timed out or failed"
            echo '{"version": "2.1.0", "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json", "runs": [{"tool": {"driver": {"name": "Trivy", "version": "timeout"}}, "results": []}]}' > trivy-results.sarif
          }
          
          # Run config scan on changed files only
          echo "Running config scan on changed files..."
          timeout 120 trivy config \
            --format sarif \
            --output trivy-config-results.sarif \
            --severity HIGH,CRITICAL \
            --cache-dir "${{ env.TRIVY_CACHE_DIR }}" \
            --timeout 60s \
            "$SCAN_DIR" || {
            echo "⚠️ Trivy config scan timed out or failed"
            echo '{"version": "2.1.0", "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json", "runs": [{"tool": {"driver": {"name": "Trivy", "version": "timeout"}}, "results": []}]}' > trivy-config-results.sarif
          }
          
          # Cleanup
          rm -rf "$SCAN_DIR"
          echo "✅ Trivy scans completed"

      - name: Create empty SARIF files if no changes
        if: steps.changed-files-security.outputs.changed == 'false'
        run: |
          echo "Creating empty SARIF files (no security-relevant changes)"
          echo '{"version": "2.1.0", "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json", "runs": [{"tool": {"driver": {"name": "Trivy", "version": "no-changes"}}, "results": []}]}' > trivy-results.sarif
          echo '{"version": "2.1.0", "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json", "runs": [{"tool": {"driver": {"name": "Trivy", "version": "no-changes"}}, "results": []}]}' > trivy-config-results.sarif

      - name: Install GitHub CLI
        if: needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "📦 Installing GitHub CLI..."
          # Static release tarball instead of apt — apt hangs on these
          # ephemeral ARC runners (same failure mode as the yamllint install,
          # canary PR #964).
          GH_VERSION=2.76.1
          timeout 90 curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Upload Trivy SARIF results with retry
        if: needs.validate-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "🔄 Uploading SARIF results with retry mechanism..."
          
          # Function to try upload with timeout
          upload_with_timeout() {
            local file=$1
            local category=$2
            local attempt=$3
            
            echo "📤 Attempt $attempt: Uploading $file (category: $category)"
            
            # Use proper ref format for GitHub SARIF API
            local ref="${{ github.ref }}"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              ref="refs/heads/${{ github.event.pull_request.head.ref }}"
            fi
            
            timeout 60s gh api -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/code-scanning/sarifs" \
              -f "commit_sha=${{ github.sha }}" \
              -f "ref=$ref" \
              -f "sarif=$(cat $file | gzip | base64 -w 0)" || return 1
          }
          
          # Try filesystem SARIF upload with retries
          echo "🔄 Uploading filesystem SARIF results..."
          for attempt in 1 2 3; do
            if upload_with_timeout "trivy-results.sarif" "trivy-fs" "$attempt"; then
              echo "✅ Filesystem SARIF uploaded successfully on attempt $attempt"
              break
            else
              echo "⚠️ Filesystem SARIF upload attempt $attempt failed or timed out"
              if [ $attempt -eq 3 ]; then
                echo "❌ All filesystem SARIF upload attempts failed, continuing..."
              else
                echo "🔄 Retrying in 2 seconds..."
                sleep 2
              fi
            fi
          done
          
          # Try IaC SARIF upload with retries
          echo "🔄 Uploading IaC SARIF results..."
          for attempt in 1 2 3; do
            if upload_with_timeout "trivy-config-results.sarif" "trivy-config" "$attempt"; then
              echo "✅ IaC SARIF uploaded successfully on attempt $attempt"
              break
            else
              echo "⚠️ IaC SARIF upload attempt $attempt failed or timed out"
              if [ $attempt -eq 3 ]; then
                echo "❌ All IaC SARIF upload attempts failed, continuing..."
              else
                echo "🔄 Retrying in 2 seconds..."
                sleep 2
              fi
            fi
          done
          
          echo "✅ SARIF upload process completed"
        continue-on-error: true

  policy-validation:
    name: Kyverno Policy Validation
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    needs: [validate-changes]
    if: needs.validate-changes.result == 'success'
    timeout-minutes: 5
    env:
      CHANGED_FILES: ${{ needs.validate-changes.outputs.changed_files }}
    steps:
      - name: Skip when no cluster files changed
        if: needs.validate-changes.outputs.changed != 'true'
        run: echo "No cluster YAML changed; job succeeds." && exit 0
      - name: Checkout code
        if: needs.validate-changes.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install kyverno CLI and yq
        if: needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "📦 Installing Kyverno CLI..."
          curl -L "https://github.com/kyverno/kyverno/releases/download/v1.12.1/kyverno-cli_v1.12.1_linux_x86_64.tar.gz" -o kyverno.tar.gz
          tar -xzf kyverno.tar.gz
          sudo mv kyverno /usr/local/bin/
          kyverno version
          
          echo "📦 Installing yq..."
          sudo curl -L -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Validate against Kyverno policies
        if: needs.validate-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "🔍 Validating resources against Kyverno policies..."

          # CHANGED_FILES comes from the validate-changes job (includes the
          # app-unit closure) — no local re-derivation, one source of truth
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "✅ No files to validate against policies"
            exit 0
          fi
          
          # Find policy files by parsing 'kind' for each document (handles multi-doc YAML)
          echo "🔍 Searching for Kyverno policy files..."
          # Find policy files and store only the file paths
          POLICY_FILES=()
          while IFS= read -r f; do
            echo "📄 Checking policy file: $f"
            # handle single and multi-doc YAMLs
            if yq eval '.kind' "$f" 2>/dev/null | grep -Eq '^(Policy|ClusterPolicy)$'; then
              echo "✅ Found policy: $f"
              POLICY_FILES+=("$f")
            else
              echo "⚠️ Not a policy file: $f"
            fi
          done < <(git ls-files | grep '/kyverno/.*/policies/.*\.ya\?ml$')
          
          echo "📊 Found ${#POLICY_FILES[@]} policy files"
          if (( ${#POLICY_FILES[@]} == 0 )); then
            echo "⚠️ No Kyverno Policy/ClusterPolicy documents found"
            exit 0
          fi
          
          echo "📋 Policy files to use for validation:"
          for policy in "${POLICY_FILES[@]}"; do
            echo "  - $policy"
          done
          
          # Validate only the changed resource files
          for file in $CHANGED_FILES; do
            [[ -f "$file" ]] || continue
            
            # Skip Flux kinds if policies don't target them
            if yq eval '.kind' "$file" 2>/dev/null | grep -Eq '^(HelmRelease|OCIRepository|Kustomization)$'; then
              echo "Skipping Flux resource (not targeted by policies): $file"
              continue
            fi
            
            # Skip policy files themselves to avoid circular validation
            if [[ "$file" =~ /kyverno/.*/policies/.*\.(yaml|yml)$ ]]; then
              echo "Skipping policy file (avoiding circular validation): $file"
              continue
            fi
            
            echo "Validating: $file"
            
            # Check if file is a valid Kubernetes resource (handle multi-doc YAML)
            if ! yq eval-all '.kind' "$file" 2>/dev/null | grep -qE '^[A-Z]'; then
              echo "⚠️ Skipping non-Kubernetes resource: $file"
              continue
            fi
            
            # Build policy arguments, skipping policies that require a live cluster:
            #   - apiCall: context (inject-namespace-labels, inject-pod-labels)
            #   - mutate.targets: (mutateExisting policies like force-rescan) — these need
            #     a real k8s client to look up/patch existing resources and will error with
            #     "Handler factory requires a client but a nil client was passed" offline.
            args=()
            for p in "${POLICY_FILES[@]}"; do
              if [[ -f "$p" ]]; then
                if grep -q "apiCall:" "$p" 2>/dev/null; then
                  echo "⚠️ Skipping policy (uses apiCall context - requires live cluster): $p"
                  continue
                fi
                if grep -q "mutateExistingOnPolicyUpdate:" "$p" 2>/dev/null; then
                  echo "⚠️ Skipping policy (mutateExisting - requires live cluster): $p"
                  continue
                fi
                args+=("$p")
              fi
            done
            
            # Run validation with better error handling
            if [[ ${#args[@]} -gt 0 ]]; then
              # For multi-document YAML files, validate each document separately
              if grep -q '^---$' "$file"; then
                echo "Multi-document YAML detected, validating each document separately"
                
                # Split multi-document YAML and validate each document
                # Use yq to properly split multi-document YAML
                yq eval-all 'select(.kind != null)' "$file" | \
                yq eval-all 'split_doc' - | \
                while IFS= read -r doc; do
                  if [[ -n "$doc" && "$doc" =~ apiVersion: && "$doc" =~ kind: ]]; then
                    KIND=$(echo "$doc" | yq eval '.kind' - 2>/dev/null || echo "unknown")
                    echo "Validating document with kind: $KIND"
                    echo "Running: kyverno apply ${args[*]} --resource -"
                    echo "$doc" | kyverno apply "${args[@]}" --resource - || {
                      echo "❌ Policy validation failed for document in $file"
                      echo "🔍 Debugging info:"
                      echo "  File: $file"
                      echo "  Document kind: $KIND"
                      echo "  Policy count: ${#args[@]}"
                      echo "  Policy files: ${args[*]}"
                      echo "  Document preview:"
                      echo "$doc" | head -5
                      exit 1
                    }
                  fi
                done
                echo "✅ Validation passed for all documents in $file"
              else
                echo "Single-document YAML detected"
                echo "Running: kyverno apply ${args[*]} --resource \"$file\""
                if ! kyverno apply "${args[@]}" --resource "$file" 2>&1; then
                  echo ""
                  echo "❌ Policy validation failed for $file"
                  echo "🔍 Debugging info:"
                  echo "  File: $file"
                  echo "  Policy count: ${#args[@]}"
                  echo "  Policy files: ${POLICY_FILES[*]}"
                  echo "  Args: ${args[*]}"
                  echo ""
                  echo "🔍 Attempting to identify failing policy by testing individually..."
                  for policy in "${POLICY_FILES[@]}"; do
                    echo "Testing policy: $policy"
                    if grep -q "apiCall:" "$policy" 2>/dev/null; then
                      echo "⚠️ SKIPPED: $policy (uses apiCall context - requires live cluster)"
                      continue
                    fi
                    OUTPUT=$(kyverno apply "$policy" --resource "$file" 2>&1) || true
                    if echo "$OUTPUT" | grep -qE "fail: [1-9]|error: [1-9]"; then
                      echo "❌ FAILED: $policy"
                      echo "$OUTPUT" | grep -E "fail:|error:|warn:" | head -3
                    elif echo "$OUTPUT" | grep -q "require policy"; then
                      echo "⚠️ SKIPPED: $policy (requires variables)"
                    elif echo "$OUTPUT" | grep -qE "pass: [1-9]|pass: 0, fail: 0"; then
                      echo "✅ PASSED: $policy"
                    else
                      echo "ℹ️  NO MATCH: $policy (does not apply to this resource)"
                    fi
                  done
                  exit 1
                else
                  echo "✅ Validation passed for $file"
                fi
              fi
            else
              echo "⚠️ No valid policy files found for validation"
              exit 1
            fi
          done
          
          echo "✅ All resources comply with Kyverno policies"


  validate-terraform:
    name: Validate Terraform Modules
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    needs: [validate-changes]
    if: needs.validate-changes.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect terraform changes
        id: tf-changes
        run: |
          set -euo pipefail
          echo "🔍 Checking for changes in terraform/..."

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            HEAD_SHA="HEAD"
          fi

          TF_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep '^terraform/' || echo "")

          if [[ -n "$TF_CHANGED" ]]; then
            echo "📋 Terraform files changed:"
            echo "$TF_CHANGED"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No terraform changes detected; skipping validation"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install OpenTofu
        if: steps.tf-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if command -v tofu >/dev/null 2>&1; then
            echo "✅ OpenTofu already installed: $(tofu version | head -1)"
          else
            echo "📦 Installing OpenTofu..."
            curl -fsSL https://get.opentofu.org/install-opentofu.sh | sudo sh -s -- --install-method standalone
            tofu version
          fi

      - name: Run tofu fmt -check on all modules
        if: steps.tf-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          fmt_failed=0
          for dir in terraform/*/; do
            if [[ -d "$dir" ]]; then
              echo "🔍 Checking fmt: $dir"
              if ! tofu fmt -check -recursive "$dir"; then
                echo "❌ fmt check failed: $dir"
                fmt_failed=1
              else
                echo "✅ fmt OK: $dir"
              fi
            fi
          done
          if [[ $fmt_failed -ne 0 ]]; then
            echo "❌ One or more modules failed tofu fmt -check. Run 'tofu fmt' to fix."
            exit 1
          fi
          echo "✅ All modules passed fmt check"

      - name: Run tofu init + validate on all modules
        if: steps.tf-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for dir in terraform/*/; do
            if [[ -d "$dir" ]]; then
              echo "🔍 Validating: $dir"
              (cd "$dir" && tofu init -backend=false -input=false && tofu validate)
              echo "✅ validate OK: $dir"
            fi
          done
          echo "✅ All modules passed tofu validate"

  notify-success:
    name: Notify Success
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    needs: [validate-changes, integration-test, security-scan, policy-validation, validate-terraform]
    if: success()
    steps:
      - name: Success notification
        run: |
          set -euo pipefail
          echo "✅ All CI checks passed!"
          echo "🚀 Ready for deployment"

  notify-failure:
    name: Notify Failure
    runs-on: ${{ vars.CI_RUNNER || 'vollminlab' }}
    needs: [validate-changes, integration-test, security-scan, policy-validation, validate-terraform]
    if: failure()
    steps:
      - name: Failure notification
        run: |
          set -euo pipefail
          echo "❌ CI checks failed!"
          echo "🔧 Please review the failed steps above"