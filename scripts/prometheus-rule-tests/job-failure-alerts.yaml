# KubeJobFailed must ignore Jobs a CronJob created, and CronJobFailingRepeatedly must
# fire only when at least 3 runs AND at least a quarter of a CronJob's runs failed.
rule_files:
  - rules/monitoring-vollminlab-custom-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'kube_job_owner{namespace="ns", job_name="standalone", owner_kind="", owner_name="", owner_is_controller=""}'
        values: '1x60'
      - series: 'kube_job_failed{namespace="ns", job_name="standalone", condition="true"}'
        values: '1x60'
      - series: 'kube_job_owner{namespace="ns", job_name="owned-1", owner_kind="CronJob", owner_name="transient", owner_is_controller="true"}'
        values: '1x60'
      - series: 'kube_job_failed{namespace="ns", job_name="owned-1", condition="true"}'
        values: '1x60'
