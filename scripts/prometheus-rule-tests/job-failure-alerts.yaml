    alert_rule_test:
      - eval_time: 30m
        alertname: KubeJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ns, job_name: standalone}
            exp_annotations:
              summary: "Job ns/standalone failed to complete"
              description: >-
                Job ns/standalone failed. Removing failed job after
                investigation should clear this alert. Jobs created by a CronJob are covered by
                CronJobNotSucceeding and CronJobFailingRepeatedly instead.
      - eval_time: 30m
        alertname: CronJobFailingRepeatedly
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ns, cronjob: flaky}
            exp_annotations:
              summary: "CronJob ns/flaky failed 50% of its runs in the last 23h"
              description: >-
                At least 3 Jobs failed and they are at least a quarter of the Jobs this CronJob
                created in 23h, even though some runs succeed. Look at a recent failed Job:
                `kubectl get jobs -n ns | grep flaky`.
