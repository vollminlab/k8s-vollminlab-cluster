apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-values
  namespace: dmz
  labels:
    app: minecraft
    env: production
    category: gaming
data:
  values.yaml: |
    image:
      repository: itzg/minecraft-server
      # 26.x requires Java 25 (1.21.x required 21). Paper's own version
      # metadata reports java.version.minimum=25 for 26.1.2 and 26.2, so this
      # tag has to move in the same commit as the version below or the server
      # will not start.
      tag: "java25"
    resources:
      requests:
        cpu: 2000m
        memory: 6Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    nodeSelector:
      node-role.kubernetes.io/dmz: "true"
    tolerations:
      - key: "dmz"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    podLabels:
      env: production
      category: gaming
    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    persistence:
      dataDir:
        enabled: true
        existingClaim: pvc-minecraft-datadir
      storageClass: longhorn-dmz
    minecraftServer:
      eula: "TRUE"
      # 26.2, Paper's current release line (build #116, 2026-08-23).
      #
      # 1.21.10 was EOL: its last build was #130 on 2026-01-04 and Paper's API
      # reports support.status=UNSUPPORTED, end=2026-01-17. The obvious smaller
      # hop, 1.21.11, is EOL too -- last build #132 on 2026-05-11, support ended
      # 2026-06-15 -- so it would trade one dead branch for another and still
      # need this same window later. Only 26.1.2 and 26.2 report SUPPORTED, and
      # 26.2 is the current line.
      #
      # This migrates the world format and is NOT reversible. Verified backups
      # exist before the roll: minecraft-pre-1131-20260824010150 (MinIO, 720h),
      # velero-daily-full-20260823030001 (MinIO), velero-daily-b2-20260823040001
      # (B2, 2160h) -- each with a Completed PodVolumeBackup for `datadir`
      # carrying a real snapshot ID and ~5.85 GB, not just a Completed Backup.
      version: "26.2"
      type: "PAPER"
      memory: "6G"
      viewDistance: 8
      maxPlayers: 20
      difficulty: normal
      serviceType: NodePort
      nodePort: 32565
      externalTrafficPolicy: Local
      whitelist: "svollmi1,Brainsteen,FenycFur,mattgutkin,Dirtbikedemon01,Forgonploxi,Gurty,Plasmaticmofo2"
      ops: "svollmi1"
      # Set maxWorldSize to prevent duplicate MAX_WORLD_SIZE env var in Helm deployment
      # NOTE: This sets the env var, but server.properties must be manually set to 29999984
      # The server.properties file is in a PVC and persists across restarts
      # Manual fix applied: max-world-size=29999984 in /data/server.properties
      #
      # Must stay an unquoted number: the chart's values.schema.json accepts a number
      # or the literal string "default" and nothing else, so quoting it fails
      # `helm template` with
      #   at '/minecraftServer/maxWorldSize': value must be 'default'
      # Known consequence, do not try to "fix" it by quoting: Helm renders the number
      # as a float, so the container gets MAX_WORLD_SIZE=2.9999984e+07 (verified on
      # the live pod) while server.properties holds the correct hand-applied
      # 29999984. That mismatch is inert only because OVERRIDE_SERVER_PROPERTIES is
      # unset and nothing ever writes the env value to disk. Enabling that override
      # would write the scientific-notation string and corrupt the setting.
      maxWorldSize: 29999984
      rcon:
        enabled: true
        # Password is now stored in SealedSecret and passed via environment variable
    extraEnv:
      SIMULATION_DISTANCE: "6"
      # --- Reduce what internet scanners learn from a server-list ping ----------
      # 29 days of logs show ~13 probes from scanners (ScanProbe, KittyScan,
      # herobrine, JohnCDupe and friends) and 0 successful logins -- the whitelist
      # held every time. These two settings do not add access control, they shrink
      # what an unauthenticated probe gets back.
      #
      # hide-online-players: the status ping otherwise returns the current player
      # list, which is exactly what server-cataloguing scanners harvest.
      HIDE_ONLINE_PLAYERS: "TRUE"
      # rate-limit: packets/sec per connection before the server kicks. Vanilla
      # default is 0, i.e. disabled. 300 is the commonly used safe value -- high
      # enough that normal play never approaches it, low enough to blunt a flood.
      RATE_LIMIT: "300"
      # BlueMap 5.23, the **paper** build. This server is Paper, and the spigot
      # build warns on every boot:
      #   This seems to be a PAPER-based server, but you are using the SPIGOT
      #   version of BlueMap.
      #   Failed to detect the minecraft version of this server! Using latest
      #   version.
      # The second line is the one that matters: BlueMap falls back to guessing
      # the resource version instead of asking the server, which risks incorrect
      # block rendering for anything new in 26.2.
      #
      # The spigot pin was inherited from the 5.13 era and carried forward
      # unexamined through the 26.2 upgrade (#1219); it was never the right
      # build for this server.
      #
      # Version must stay in step with minecraftServer.version above: 5.23
      # covers 26.1 through 26.2 only, and 5.13 covered 1.20 through 1.21.11.
      # No build spans both, so the two always move together.
      PLUGINS: "https://cdn.modrinth.com/data/swbUV1cr/versions/K5U1ASjn/bluemap-5.23-paper.jar"
      OVERRIDE_WHITELIST: "TRUE"
    # RCON password from secret (itzg/minecraft-server supports RCON_PASSWORD env var)
    # Note: The Helm chart may need extraEnvVars or envFrom instead - check chart docs
    extraEnvVars:
      - name: RCON_PASSWORD
        valueFrom:
          secretKeyRef:
            name: minecraft-rcon-secret
            key: password
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 10
      successThreshold: 1
      timeoutSeconds: 1
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 5
      failureThreshold: 10
      successThreshold: 1
      timeoutSeconds: 1
