apiVersion: v1
kind: ConfigMap
metadata:
  name: portainer-values
  namespace: portainer
  labels:
    app: portainer
    env: production
    category: apps
data:
  values.yaml: |
    service:
      type: ClusterIP
      annotations: {}
    ingress:
      enabled: false
    persistence:
      enabled: true
      # portainer-data (Longhorn) replaces the old `portainer` claim, which was
      # local-path -> hostPath on k8sworker02: unbacked, unreplicated, node-pinned
      # and invisible to volume metrics. See pvc.yaml.
      # The claim is declared in pvc.yaml rather than left to the chart so it is
      # GitOps-managed -- the old one existed only in the cluster, in no manifest.
      existingClaim: portainer-data
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    serviceAccount:
      create: true
      name: portainer-sa-clusteradmin
      annotations: {}
    rbac:
      enabled: true
    edge:
      enabled: true
      tunnelPort: 30776
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
