apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
  labels:
    app: harbor-db
    env: production
    category: storage
spec:
  instances: 2
  # Sized from 14d measured usage (p95 152Mi, peak 239Mi, cpu p95 12m).
  # Without this block the instance pods are BestEffort -- the first QoS class the
  # kubelet evicts under node memory pressure, and the highest oom_score_adj for the
  # node OOM killer. Kyverno's require-resources never flagged it because that policy
  # matches Deployment/StatefulSet/DaemonSet and CNPG creates bare Pods.
  # Request sits above p95 so the scheduler reserves what is actually used; the limit
  # carries the headroom. No CPU limit, per this cluster's policy.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  inheritedMetadata:
    labels:
      app: harbor-db
      env: production
      category: storage
  storage:
    size: 10Gi
    storageClass: longhorn
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: registry
      owner: harbor
      secret:
        name: harbor-db-credentials
      postInitSQL:
        - GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO harbor
        - GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO harbor
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO harbor
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO harbor
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/harbor-db"
      endpointURL: "http://minio.minio.svc.cluster.local:9000"
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "14d"
