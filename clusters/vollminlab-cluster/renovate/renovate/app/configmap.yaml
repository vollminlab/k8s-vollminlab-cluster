apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-values
  namespace: renovate
  labels:
    app: renovate
    env: production
    category: apps
data:
  values.yaml: |
    cronjob:
      schedule: "0 23 * * *"
      timeZone: "America/New_York"
      suspend: false

    pod:
      labels:
        app: renovate
        env: production
        category: apps

    # Pod-level security context — required to satisfy PSS "restricted" enforced
    # on the renovate namespace (runAsNonRoot + RuntimeDefault seccomp).
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    # Memory was 512Mi/1536Mi from the original deploy, when renovate managed one
    # repository. #1148 (2026-08-20) added four more without revisiting it. Peak
    # working set stepped from ~0.85Gi to ~1.4Gi on the very next run and has sat
    # pinned at the 1536Mi ceiling since 08-26, OOMKilling every pod.
    #
    # 3Gi is deliberately generous, not measured: the true peak is unknowable while
    # the cgroup clips it, so 1.5Gi is a floor on demand rather than the requirement.
    # Re-measure after a clean run and trim:
    #   max_over_time(container_memory_working_set_bytes{namespace="renovate"}[7d])
    #
    # The request moves too. 512Mi against a ~1.4Gi working set understated this pod
    # to the scheduler by ~1Gi, which is how it kept landing on k8sworker04 at 89%
    # requested memory. It is a ~15-minute daily job, so the larger reservation costs
    # nothing outside the run.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 3Gi

    envFrom:
      - secretRef:
          name: renovate-token

    renovate:
      # Container-level security context — PSS "restricted" requires
      # allowPrivilegeEscalation: false and all capabilities dropped.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      config: |
        {
          "platform": "github",
          "repositories": [
            "vollminlab/k8s-vollminlab-cluster",
            "vollminlab/masters-league",
            "vollminlab/vollmint",
            "vollminlab/shlink-ingress-controller",
            "vollminlab/longhorn-rebalancing-controller"
          ],
          "gitAuthor": "Renovate Bot <bot@renovateapp.com>",
          "onboarding": false,
          "requireConfig": "optional",
          "autodiscover": false,
          "customManagers": [
            {
              "customType": "regex",
              "fileMatch": ["^\\.kubernetes-version$"],
              "matchStrings": ["^(?<currentValue>[\\d.]+)"],
              "datasourceTemplate": "github-releases",
              "depNameTemplate": "kubernetes/kubernetes",
              "extractVersionTemplate": "^v(?<version>.*)$"
            }
          ],
          "packageRules": [
            {
              "matchDepNames": ["kubernetes/kubernetes"],
              "allowedVersions": "/^v[0-9]+\\.[0-9]+\\.[0-9]+$/",
              "commitMessagePrefix": "chore(k8s):"
            }
          ]
        }
