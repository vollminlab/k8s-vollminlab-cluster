apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-attachment-ticket-reaper
  namespace: longhorn-system
  labels:
    app: longhorn-attachment-ticket-reaper
    env: production
    category: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-attachment-ticket-reaper
  labels:
    app: longhorn-attachment-ticket-reaper
    env: production
    category: storage
rules:
  # The reaper patches only spec.attachmentTickets on VolumeAttachments.
  - apiGroups: ["longhorn.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "patch"]
  # Read-only: a volume with any live snapshot object is never touched.
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents", "volumesnapshots"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-attachment-ticket-reaper
  labels:
    app: longhorn-attachment-ticket-reaper
    env: production
    category: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-attachment-ticket-reaper
subjects:
  - kind: ServiceAccount
    name: longhorn-attachment-ticket-reaper
    namespace: longhorn-system
