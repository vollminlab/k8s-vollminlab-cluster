apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-values
  namespace: longhorn-system
  labels:
    app: longhorn
    env: production
    category: storage
data:
  values.yaml: |
    # Longhorn 1.12.1 began rendering NetworkPolicies for the manager, webhook,
    # instance-manager and backing-image components. They allow ingress only from
    # named Longhorn pods, which silently blocked Prometheus from scraping
    # longhorn-manager:9500 — 100% of longhorn-backend targets went down and
    # TargetDown fired minutes after the upgrade. This cluster has never had
    # NetworkPolicies in longhorn-system; set it explicitly so a future chart
    # default cannot re-enable them without us choosing to.
    networkPolicies:
      enabled: false
    defaultSettings:
      defaultReplicaCount: 3
      defaultDataPath: /var/lib/longhorn
      taintToleration: "dmz=true:NoSchedule;dmz=true:NoExecute"
      storageOverProvisioningPercentage: 100
      storageMinimalAvailablePercentage: 25
    longhornManager:
      podLabels:
        app: longhorn-manager
        env: production
        category: storage
      tolerations:
        - key: "dmz"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "dmz"
          operator: "Equal"
          value: "true"
          effect: "NoExecute"
    # longhornDriver covers engine-image and driver pods
    longhornDriver:
      podLabels:
        app: longhorn-driver
        env: production
        category: storage
      tolerations:
        - key: "dmz"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "dmz"
          operator: "Equal"
          value: "true"
          effect: "NoExecute"
    csi:
      attacher:
        podLabels:
          app: longhorn-csi-attacher
          env: production
          category: storage
      provisioner:
        podLabels:
          app: longhorn-csi-provisioner
          env: production
          category: storage
      resizer:
        podLabels:
          app: longhorn-csi-resizer
          env: production
          category: storage
      snapshotter:
        podLabels:
          app: longhorn-csi-snapshotter
          env: production
          category: storage
      plugin:
        podLabels:
          app: longhorn-csi-plugin
          env: production
          category: storage
        tolerations:
          - key: "dmz"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
          - key: "dmz"
            operator: "Equal"
            value: "true"
            effect: "NoExecute"
    ui:
      podLabels:
        app: longhorn-ui
        env: production
        category: storage
    supportBundleKit:
      podLabels:
        app: longhorn-support-bundle-kit
        env: production
        category: storage
    metrics:
      serviceMonitor:
        enabled: true