apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-rebalancing-controller-values
  namespace: longhorn-system
  labels:
    app: longhorn-rebalancing-controller
    env: production
    category: storage
data:
  values.yaml: |
    podLabels:
      app: longhorn-rebalancing-controller
      env: production
      category: storage

    imagePullSecrets:
      - name: harbor-vollminlab-pull

    config:
      dryRun: false
      rebalance:
        maxEvictionsPerDay: 4
        smallestFirst: false
        # Keep evictions out of the nightly backup window (VolSync 00:00-02:00,
        # daily-full 03:00, daily-b2 04:00, vm-b2 05:00) — the chart default
        # 02:00-05:00 sat exactly on top of it, and with smallestFirst:false a
        # 77GiB MinIO replica rebuild collapsed under the contention on
        # 2026-07-20 (~02:30), degrading the volume right before daily-full.
        maintenanceWindow: "13:00-19:00"
      move:
        # After a volume is moved, keep it off the victim list for this long so
        # a single convergence run can't shuffle the same volume repeatedly
        # (v0.4.0 peak-reduction guard already prevents oscillation; this is the
        # belt-and-suspenders bound). 0 disables. Chart default is also 360.
        perVolumeBackoffMinutes: 360

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
