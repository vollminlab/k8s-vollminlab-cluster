apiVersion: v1
kind: ConfigMap
metadata:
  name: metallb-values
  namespace: metallb-system
  labels:
    app: metallb
    env: production
    category: networking
data:
  values.yaml: |
    crds:
      enabled: true
    controller:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          # 128Mi -> 256Mi. Measured 2026-09-09: 7d p95 90Mi, 7d peak 125Mi
          # against a 128Mi ceiling -- 98% -- and the container had OOMKilled
          # (exit 137) 36 times over its 102-day life, most recently during the
          # 07:30 vmbackup I/O spike. While it is dead no LoadBalancer service
          # can be allocated an address, which is silent until something needs one.
          #
          # The speakers deliberately keep 128Mi: their 7d peak is 52Mi (41% of
          # limit), so their restarts are not memory. Those cluster on 08-08,
          # 08-25 and 09-01 -- node flaps and rollouts -- and raising the limit
          # would only hide that.
          memory: 256Mi
    frr-k8s:
      prometheus:
        serviceMonitor:
          enabled: false
      frrk8s:
        frr:
          resources:
            requests:
              # VPA target/upperBound ~11m (BGP daemon is near-idle). Request
              # 100m→50m (DaemonSet on every node). No limit block — unchanged.
              cpu: 50m
              memory: 128Mi
        frrMetrics:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
        frrStatus:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        reloader:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        livenessProbe:
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 5
    speaker:
      enabled: true
      podAnnotations:
        backup.velero.io/backup-volumes-excludes: "frr-sockets,frr-conf,reloader,metrics,frr-tmp,frr-lib,frr-log"
      tolerations:
        - key: dmz
          operator: Exists
          effect: NoSchedule
        - key: dmz
          operator: Exists
          effect: NoExecute
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
