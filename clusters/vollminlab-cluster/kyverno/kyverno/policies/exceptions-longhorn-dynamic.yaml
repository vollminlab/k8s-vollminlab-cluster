apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: ignore-longhorn-dynamic-pods
  namespace: kyverno
  labels:
    app: kyverno
    env: production
    category: security
spec:
  # Longhorn creates several resource types that cannot be labelled via GitOps:
  # - DaemonSet/longhorn-manager and Deployment/longhorn-ui are third-party
  #   chart resources with no label injection point in their Helm values.
  # - instance-manager-*, share-manager-*, engine-image-*, longhorn-manager-*,
  #   longhorn-ui-*, and c-*-* (recurring job) pods are created dynamically by
  #   the Longhorn controller, not by any GitOps-managed workload spec.
  match:
    any:
      - resources:
          kinds:
            - DaemonSet
          namespaces:
            - longhorn-system
          names:
            - "longhorn-manager"
      - resources:
          kinds:
            - Deployment
          namespaces:
            - longhorn-system
          names:
            - "longhorn-ui"
      - resources:
          kinds:
            - Pod
          namespaces:
            - longhorn-system
          names:
            - "instance-manager-*"
            - "share-manager-*"
            - "engine-image-*"
            - "longhorn-manager-*"
            - "longhorn-ui-*"
            - "c-*"
      # RecurringJob-generated CronJobs (filesystem-trim, snapshot-retention)
      # and the Jobs they spawn. There is no way to give these resources: the
      # recurringjobs.longhorn.io v1beta2 spec is
      # {concurrency, cron, groups, labels, name, parameters, retain, task} —
      # verified against the live CRD schema, there is no resources field. They
      # are also unreachable by inject-resource-requirements, which matches
      # Deployment/DaemonSet/StatefulSet only. Matched on Longhorn's own
      # managed-by label rather than by name, so a RecurringJob added later is
      # covered automatically and nothing we author can ever match.
      - resources:
          kinds:
            - CronJob
            - Job
          namespaces:
            - longhorn-system
          selector:
            matchLabels:
              longhorn.io/managed-by: longhorn-manager
  exceptions:
    - policyName: require-standard-labels
      ruleNames:
        - require-labels-on-controllers
        - require-labels-on-pods
    - policyName: require-resources
      ruleNames:
        - require-limits
    - policyName: require-resources-batch
      ruleNames:
        - require-limits-job
        - require-limits-cronjob
