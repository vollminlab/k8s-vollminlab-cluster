apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-resource-requirements
  annotations:
    policies.kyverno.io/title: Inject Manual Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: "Injects CPU and memory requests/limits for workloads that cannot be configured via Helm values, such as Longhorn and other non-standard charts."
spec:
  rules:
    - name: inject-resource-requirements
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - DaemonSet
                - StatefulSet
              namespaces:
                - longhorn-system
              # longhorn-csi-plugin, longhorn-driver-deployer and every
              # engine-image-ei-* object carry `app: longhorn`, not their own
              # component name, so they cannot be targeted by this selector.
              # Rules for them existed here but could never fire; they are
              # covered by a PolicyException instead.
              selector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - longhorn-ui
                      - csi-attacher
                      - csi-provisioner
                      - csi-resizer
                      - csi-snapshotter
                      - longhorn-manager
      mutate:
        foreach:
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: csi-attacher
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): csi-attacher
                        resources:
                          requests:
                            cpu: "20m"
                            memory: "64Mi"
                          limits:
                            cpu: "100m"
                            memory: "128Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: csi-provisioner
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): csi-provisioner
                        resources:
                          requests:
                            cpu: "20m"
                            memory: "64Mi"
                          limits:
                            cpu: "100m"
                            memory: "128Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: csi-resizer
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): csi-resizer
                        resources:
                          requests:
                            cpu: "20m"
                            memory: "64Mi"
                          limits:
                            cpu: "100m"
                            memory: "128Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: csi-snapshotter
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): csi-snapshotter
                        resources:
                          requests:
                            cpu: "20m"
                            memory: "64Mi"
                          limits:
                            cpu: "100m"
                            memory: "128Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: longhorn-ui
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): longhorn-ui
                        resources:
                          requests:
                            cpu: "5m"
                            memory: "16Mi"
                          limits:
                            cpu: "20m"
                            memory: "32Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: longhorn-manager
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): longhorn-manager
                        resources:
                          requests:
                            cpu: "100m"
                            memory: "384Mi"
                          limits:
                            cpu: "1"
                            memory: "1Gi"