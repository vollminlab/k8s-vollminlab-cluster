apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-resource-requirements
  annotations:
    policies.kyverno.io/title: Inject Manual Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: "Injects CPU and memory requests/limits for workloads that cannot be configured via Helm values, such as Longhorn and other non-standard charts."
spec:
  rules:
    - name: inject-resource-requirements
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - DaemonSet
                - StatefulSet
              namespaces:
                - longhorn-system
              # longhorn-csi-plugin, longhorn-driver-deployer and every
              # engine-image-ei-* object carry `app: longhorn`, not their own
              # component name, so they cannot be targeted by this selector.
              # Rules for them existed here but could never fire; they are
              # covered by a PolicyException instead.
              selector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - longhorn-ui
                      - csi-attacher
                      - csi-provisioner
                      - csi-resizer
                      - csi-snapshotter
                      - longhorn-manager
      # Memory values measured over 30d (2026-08-21), working-set p95 / max:
      #   csi-attacher      55.0Mi / 55.1Mi   -> request  64Mi, limit 128Mi
      #   csi-provisioner   52.7Mi / 53.9Mi   -> request  64Mi, limit 128Mi
      #   csi-resizer       67.9Mi / 68.6Mi   -> request  80Mi, limit 160Mi
      #   csi-snapshotter   61.7Mi / 63.6Mi   -> request  80Mi, limit 160Mi
      #   longhorn-ui        4.8Mi /  6.0Mi   -> request  16Mi, limit  32Mi
      #   longhorn-manager 564.1Mi / 607.1Mi  -> request 384Mi (SEE BELOW), limit 1Gi
      #
      # resizer and snapshotter were previously requesting 64Mi, below their own p95 --
      # a request under real usage under-declares the workload to the scheduler, which
      # is what put the CNPG pods in BestEffort until #1120. Limits are ~2.3x measured
      # max in every case.
      #
      # longhorn-manager's 384Mi request is ALSO below its 564Mi p95, but it is a
      # DaemonSet on 9 nodes, so correcting it reserves ~5.8Gi cluster-wide and
      # k8sworker02 has only 2.2Gi of request headroom. Deliberately left for a
      # separate capacity decision -- it is exempted from require-resources by
      # ignore-longhorn-dynamic-pods, so it is not a blocking risk. Tracked in #1155.
      #
      # CPU is unchanged: measured p95 is under 1.5m and max under 3m for all four
      # sidecars, so the 20m request and 100m limit are far from binding.
      mutate:
        foreach:
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: csi-attacher
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): csi-attacher
                        resources:
                          requests:
                            cpu: "20m"
                            memory: "64Mi"
                          limits:
                            cpu: "100m"
                            memory: "128Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: csi-provisioner
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): csi-provisioner
                        resources:
                          requests:
                            cpu: "20m"
                            memory: "64Mi"
                          limits:
                            cpu: "100m"
                            memory: "128Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: csi-resizer
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): csi-resizer
                        resources:
                          requests:
                            cpu: "20m"
                            memory: "80Mi"
                          limits:
                            cpu: "100m"
                            memory: "160Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: csi-snapshotter
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): csi-snapshotter
                        resources:
                          requests:
                            cpu: "20m"
                            memory: "80Mi"
                          limits:
                            cpu: "100m"
                            memory: "160Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: longhorn-ui
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): longhorn-ui
                        resources:
                          requests:
                            cpu: "5m"
                            memory: "16Mi"
                          limits:
                            cpu: "20m"
                            memory: "32Mi"
          - list: "request.object.spec.template.spec.containers || `[]`"
            preconditions:
              all:
                - key: "{{element.name}}"
                  operator: Equals
                  value: longhorn-manager
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - (name): longhorn-manager
                        resources:
                          requests:
                            cpu: "100m"
                            memory: "384Mi"
                          limits:
                            cpu: "1"
                            memory: "1Gi"