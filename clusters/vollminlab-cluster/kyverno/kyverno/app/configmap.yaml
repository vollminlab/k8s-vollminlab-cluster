apiVersion: v1
kind: ConfigMap
metadata:
  name: kyverno-values
  namespace: kyverno
  labels:
    app: kyverno
    env: production
    category: security
  annotations:
    meta.helm.sh/release-name: kyverno
    meta.helm.sh/release-namespace: kyverno
data:
  values.yaml: |
    podLabels:
      app: kyverno
      env: production
      category: security

    labels:
      app: kyverno
      env: production
      category: security

    features:
      policyExceptions:
        enabled: true
        namespace: kyverno

    admissionController:
      labels:
        app: kyverno-admission-controller
        env: production
        category: security
      podLabels:
        app: kyverno-admission-controller
        env: production
        category: security
      replicas: 3
      priorityClassName: system-cluster-critical
      container:
        extraArgs:
          webhookTimeout: "30"
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      service:
        ports:
          - name: https
            port: 443
            targetPort: 9443

    backgroundController:
      rbac:
        clusterRole:
          extraResources:
            - apiGroups: ["apps"]
              resources: ["deployments", "statefulsets", "daemonsets"]
              verbs: ["get", "list", "watch", "patch", "update"]
      labels:
        app: kyverno-background-controller
        env: production
        category: security
      podLabels:
        app: kyverno-background-controller
        env: production
        category: security
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    cleanupController:
      # Disabled: cleanup controller scans all CRDs including Calico tiered
      # policy CRDs (globalnetworkpolicies.projectcalico.org) which Calico's
      # webhook rejects for non-Enterprise users. Kyverno's resourceFilters
      # do not apply to the cleanup controller, and it has no exclude mechanism.
      # Re-enable when TTL policies are needed; check if a newer Kyverno version
      # resolves the Calico webhook conflict first.
      enabled: false
      labels:
        app: kyverno-cleanup-controller
        env: production
        category: security
      podLabels:
        app: kyverno-cleanup-controller
        env: production
        category: security
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    reportsController:
      featuresOverride:
        backgroundScan:
          # Let the reports controller honor config.resourceFilters so it does
          # not list deprecated served CRD versions during background scans.
          skipResourceFilters: false
      labels:
        app: kyverno-reports-controller
        env: production
        category: security
      podLabels:
        app: kyverno-reports-controller
        env: production
        category: security
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    config:
      # THE webhook scope. This is the only key the chart actually honours for
      # it -- see the removed blocks below for the three that did not.
      #
      # Kyverno's resource webhooks are failurePolicy: Fail, and that is NOT
      # settable from this chart: Kyverno derives it from each ClusterPolicy's
      # spec.failurePolicy (all 20 here are unset, so all default to Fail) and
      # registers the rules into its `svc-fail` webhook. Fighting the controller
      # for ownership of that field does not work -- it reverts within seconds.
      #
      # So a cold boot deadlocks unless the CNI namespaces are out of scope:
      # with Kyverno down, a fail-closed webhook rejects pod CREATE everywhere
      # it applies, Calico cannot start, and because Kyverno's own controllers
      # are hostNetwork: false they need the CNI that Calico would have provided.
      # calico-node, calico-typha and tigera-operator are all hostNetwork: true,
      # so they start fine on their own -- admission is the only thing stopping
      # them.
      #
      # flux-system is deliberately NOT excluded. Kyverno enforcing on the one
      # component that can apply anything to the cluster was a deliberate choice
      # (see policies/flux-exception.yaml), and Flux is not on the cold-boot
      # critical path -- the Calico DaemonSet already exists and is recreated by
      # the DaemonSet controller without Flux running.
      #
      # The kyverno namespace itself is excluded automatically by
      # excludeKyvernoNamespace (default true).
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system      # chart default; coredns, kube-proxy
                - calico-system    # CNI -- must start before anything needing network
                - tigera-operator  # owns the Calico install
      resourceFilters:
        # Calico / Tigera CRDs — reports controller SA has no RBAC for these
        - '[GlobalNetworkPolicy,*,*]'
        - '[NetworkPolicy,*,*]'
        - '[Tier,*,*]'
        - '[StagedGlobalNetworkPolicy,*,*]'
        - '[StagedNetworkPolicy,*,*]'
        - '[StagedKubernetesNetworkPolicy,*,*]'
        - '[GlobalNetworkSet,*,*]'
        - '[BGPPeer,*,*]'
        - '[BlockAffinity,*,*]'
        - '[ClusterInformation,*,*]'
        - '[FelixConfiguration,*,*]'
        - '[HostEndpoint,*,*]'
        - '[IPAMHandle,*,*]'
        - '[IPPool,*,*]'
        - '[IPReservation,*,*]'
        - '[KubeControllersConfiguration,*,*]'
        - '[Installation,*,*]'
        - '[TigeraStatus,*,*]'
        # Deprecated Kyverno / Flux CRDs — removed in newer API versions
        - '[Alert,*,*]'
        - '[CleanupPolicy,*,*]'
        - '[ClusterCleanupPolicy,*,*]'
        - '[GlobalContextEntry,*,*]'
        - '[ImageValidatingPolicy,*,*]'
        - '[PolicyException,*,*]'
        - '[ValidatingPolicy,*,*]'
        - '[DeletingPolicy,*,*]'
        # Longhorn internal CRDs — no policies target these
        - '[BackupBackingImage,*,*]'
        - '[Backup,*,*]'
        - '[EngineImage,*,*]'
        - '[Orphan,*,*]'
        - '[Setting,*,*]'
        - '[ShareManager,*,*]'
        - '[Snapshot,*,*]'
        - '[SupportBundle,*,*]'
        # MetalLB CRDs — no policies target these
        - '[BFDProfile,*,*]'
        - '[L2Advertisement,*,*]'
        # Prometheus Operator / Grafana Agent CRDs — no policies target these
        - '[Alertmanager,*,*]'
        - '[AlertmanagerConfig,*,*]'
        - '[ServiceMonitor,*,*]'
        - '[ThanosRuler,*,*]'
        - '[GrafanaAgent,*,*]'
        - '[MetricsInstance,*,*]'
        # CNPG CRDs — no policies target these
        - '[Database,*,*]'
        - '[ImageCatalog,*,*]'
        - '[Subscription,*,*]'
        # Velero CRDs — no policies target these
        - '[PodVolumeBackup,*,*]'
        # Kubernetes built-ins with no applicable policies
        - '[Secret,*,*]'
        - '[PodTemplate,*,*]'
        - '[ClusterRoleBinding,*,*]'
        - '[StorageClass,*,*]'
        - '[CSIStorageCapacity,*,*]'
        - '[CustomResourceDefinition,*,*]'
        - '[PriorityClass,*,*]'
        - '[RuntimeClass,*,*]'
        - '[Lease,*,*]'
        # Kubernetes 1.33 new networking types — Kyverno 1.18 returns 400 for unknown types,
        # which causes kube-apiserver to crash on startup when creating the default ServiceCIDR.
        # matchConditions below also excludes these at the apiserver level (belt-and-suspenders).
        - '[ServiceCIDR,*,*]'
        - '[IPAddress,*,*]'
      # namespaceSelector can't exclude cluster-scoped resources; CEL evaluated by apiserver before any Kyverno connection
      matchConditions:
        - name: exclude-auth-review-resources
          expression: "!(request.resource.resource in ['subjectaccessreviews', 'selfsubjectaccessreviews', 'selfsubjectrulesreviews', 'tokenreviews'])"
        - name: exclude-k8s133-network-resources
          expression: "!(request.resource.resource in ['servicecidrs', 'ipaddresses'])"

    serviceMonitor:
      enabled: true
