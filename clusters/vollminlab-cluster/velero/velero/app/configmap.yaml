apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-values
  namespace: velero
  labels:
    app: velero
    env: production
    category: storage
data:
  values.yaml: |
    podLabels:
      app: velero
      env: production
      category: storage

    resources:
      requests:
        # VPA target/upperBound ~11m; server is idle between backup runs. Request
        # right-sized 500m→100m so the scheduler stops reserving idle cores on the
        # general workers. Limit unchanged — bursts during backups still allowed.
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1500Mi

    # AWS plugin provides S3-compatible support for both MinIO and Backblaze B2
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.2
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    # CSI snapshots disabled — using kopia file-system backup instead
    # Prevents chart from creating an empty VolumeSnapshotLocation
    snapshotsEnabled: false

    # Per-BSL credentials are used; no global credentials secret needed
    credentials:
      useSecret: false

    repositoryMaintenanceJob:
      repositoryConfigData:
        global:
          keepLatestMaintenanceJobs: 3
          podResources:
            cpuRequest: "50m"
            cpuLimit: "200m"
            memoryRequest: "128Mi"
            memoryLimit: "256Mi"

    configuration:
      # Use kopia file-system backup for PVC data
      defaultVolumesToFsBackup: true

      # Validate BSLs and sync backup list hourly instead of default 1 minute
      # Prevents excessive Class C API calls against Backblaze B2
      storeValidationFrequency: 1h
      backupSyncPeriod: 1h

      # Force-fail PVBs stuck in InProgress/Prepared after 30 minutes.
      # Without this, the node-agent's gRPC data path can get stuck silently and
      # block all PVBs on the affected node indefinitely across multiple backup runs.
      podVolumeOperationTimeout: 30m

      # Client-side rate limit for velero's own kube API calls.
      # `velero server` defaults are qps=20 / burst=30. A daily-full backup is now
      # ~5000 items, and for every volume-bearing pod the backup path lists the
      # node-agent pods. At 20 qps the client-side limiter — not the apiserver —
      # became the bottleneck: requests queued behind the limiter until their own
      # context expired, producing 30+ errors per run of
      #   "failed to list node-agent pods: client rate limiter Wait returned an
      #    error: context deadline exceeded"
      # and PartiallyFailed backups on 2026-08-05/06/07/10.
      # Raised moderately, not maximally: the CP nodes have an armed apiserver
      # OOM failure mode (8 GB nodes), so this is 2.5x, not 10x.
      clientQPS: 50
      clientBurst: 100

      # BackupStorageLocations MUST stay nested under configuration: — the velero
      # chart reads configuration.backupStorageLocation. If this drifts out (e.g.
      # displaced by an inserted sibling block), the chart synthesizes an invalid
      # "default" BSL with no provider and every helm upgrade fails. (Regression
      # from PR #790 left it under affinity: and broke velero upgrades for days.)
      backupStorageLocation:
        # Primary: in-cluster MinIO (fast restores, no egress cost)
        - name: minio
          provider: aws
          bucket: velero
          default: true
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: "http://minio.minio.svc.cluster.local:9000"
          credential:
            name: velero-minio-credentials
            key: cloud
        # Secondary: Backblaze B2 (off-site DR — use if MinIO is unavailable)
        - name: b2
          provider: aws
          bucket: vollminlab-k8s-backups
          config:
            region: us-west-000
            s3Url: "https://s3.us-west-000.backblazeb2.com"
            s3ForcePathStyle: "true"
          credential:
            name: velero-b2-credentials
            key: cloud

    # Prefer not to land on the same node as media stack workloads.
    # The Velero pod generates significant API/CPU load during backup runs, which
    # interferes with the node-agent's gRPC data path initialization on that node.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: category
                    operator: In
                    values:
                      - media
              topologyKey: kubernetes.io/hostname

    # node-agent DaemonSet runs kopia on every node for file-system PVC backups
    deployNodeAgent: true

    nodeAgent:
      podLabels:
        app: velero-node-agent
        env: production
        category: storage
      tolerations:
        - key: dmz
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          # VPA target ~15m; node-agent idles except during kopia FSB. Request
          # 100m→50m (DaemonSet ×6). Limit unchanged so backups still burst.
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      nodeAgentPodMonitor:
        enabled: true

    schedules:
      daily-full:
        disabled: false
        schedule: "0 3 * * *"
        useOwnerReferencesInBackup: false
        template:
          # Local MinIO copy is a fast-restore CACHE, not the retention tier: the same
          # data lands in B2 daily (daily-b2, 90d) and monthly (monthly-b2, 365d), only
          # ~1h behind. 96h (4 days) covers a long-weekend "noticed it Monday" restore at
          # LAN speed while keeping steady-state headroom on the 100Gi MinIO volume.
          # Anything older is rare and served from B2. (Was 168h; trimmed 2026-07-02.)
          ttl: 96h
          storageLocation: minio
          defaultVolumesToFsBackup: true
          # Throttle kopia's per-snapshot file read parallelism. The default is the
          # node CPU count (4 on general workers), and all worker VMDKs sit on the
          # same shared datastore — a full FSB pass drives PSI full I/O-stall to
          # 26-48% on every general worker simultaneously, which liveness-kills pods
          # on whichever node hosts the most attached volumes (restart storms on
          # k8sworker02, nightly 03:00-04:30). node-agent loadConcurrency is already
          # at its minimum (1 per node), so this is the remaining throttle knob.
          # 2 halves the concurrent pool readers while keeping daily-full (~20 min)
          # well clear of the 04:00 daily-b2 slot.
          uploaderConfig:
            parallelFilesUpload: 2
          excludedNamespaces:
            - kyverno
            - longhorn-system
            - metallb-system
            - minio
            - monitoring
            - tofu
            - trivy-system
            - velero
          resourcePolicy:
            kind: ConfigMap
            name: velero-skip-smb-policy
          # Skip VolSync's transient mover pods/PVCs (label app.kubernetes.io/created-by:
          # volsync). They are created then deleted mid-sync, so Velero hits "PVC not
          # found" -> benign errors -> PartiallyFailed. NotIn also keeps all unlabeled
          # resources (incl. the real app config PVCs), so actual data is still backed up.
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/created-by
                operator: NotIn
                values:
                  - volsync
      daily-b2:
        disabled: false
        schedule: "0 4 * * *"
        useOwnerReferencesInBackup: false
        template:
          ttl: 2160h
          storageLocation: b2
          defaultVolumesToFsBackup: true
          # Throttle kopia file read parallelism — see daily-full for rationale.
          uploaderConfig:
            parallelFilesUpload: 2
          excludedNamespaces:
            - kyverno
            - longhorn-system
            - metallb-system
            - minio
            - monitoring
            - tofu
            - trivy-system
            - velero
          resourcePolicy:
            kind: ConfigMap
            name: velero-skip-smb-policy
          # Skip VolSync's transient mover pods/PVCs (label app.kubernetes.io/created-by:
          # volsync). They are created then deleted mid-sync, so Velero hits "PVC not
          # found" -> benign errors -> PartiallyFailed. NotIn also keeps all unlabeled
          # resources (incl. the real app config PVCs), so actual data is still backed up.
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/created-by
                operator: NotIn
                values:
                  - volsync
      monthly-b2:
        disabled: false
        schedule: "0 6 1 * *"
        useOwnerReferencesInBackup: false
        template:
          ttl: 8760h
          storageLocation: b2
          defaultVolumesToFsBackup: true
          # Throttle kopia file read parallelism — see daily-full for rationale.
          uploaderConfig:
            parallelFilesUpload: 2
          excludedNamespaces:
            - kyverno
            - longhorn-system
            - metallb-system
            - minio
            - monitoring
            - tofu
            - trivy-system
            - velero
          resourcePolicy:
            kind: ConfigMap
            name: velero-skip-smb-policy
          # Skip VolSync's transient mover pods/PVCs (label app.kubernetes.io/created-by:
          # volsync). They are created then deleted mid-sync, so Velero hits "PVC not
          # found" -> benign errors -> PartiallyFailed. NotIn also keeps all unlabeled
          # resources (incl. the real app config PVCs), so actual data is still backed up.
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/created-by
                operator: NotIn
                values:
                  - volsync
      # Replaces the former `victoria-metrics-b2` schedule, which selected
      # `app: victoria-metrics` — a label no pod or PVC in this namespace has
      # ever carried (the chart forces `app: server`). It matched zero volumes
      # and reported Completed / 0 errors / 4 items every night, so the failure
      # was invisible: a Velero backup that captures nothing still succeeds.
      #
      # It is not re-pointed at victoria-metrics, because that data does not
      # need Velero:
      #   * Prometheus remote-writes the SAME stream to both tiers. Measured
      #     over 7d: 10.915B samples to each, 0 dropped, 0 failed. The hot
      #     tier's 30d is an exact subset of the cold tier's 395d.
      #   * The cold tier is backed up to this same bucket by vmbackup, which
      #     takes a real VictoriaMetrics snapshot. FSB cannot — it walks a
      #     directory that background merges are rewriting, so it would produce
      #     a torn copy even when it "succeeds".
      #   * Pointing it at the hot tier would add ~41 GiB of nightly FSB reads
      #     to the shared worker datastore, in the window that already drives
      #     PSI full I/O-stall to 26-48%, to protect redundant data.
      #
      # Grafana is what actually needed a backup here. `monitoring` is in
      # excludedNamespaces on all three other schedules, so its 1 GiB sqlite DB
      # — UI-created dashboards, users, API keys, starred/prefs — was covered
      # by nothing. The 35 sidecar dashboards are ConfigMap-provisioned and
      # reproducible; grafana.db is not.
      grafana-b2:
        disabled: false
        schedule: "0 5 * * *"
        useOwnerReferencesInBackup: false
        template:
          ttl: 2160h
          storageLocation: b2
          defaultVolumesToFsBackup: true
          # Throttle kopia file read parallelism — see daily-full for rationale.
          uploaderConfig:
            parallelFilesUpload: 2
          includedNamespaces:
            - monitoring
          # Must be a label carried by BOTH the pod and the PVC. The pod also
          # has `app: grafana`, but the chart does not put that on the PVC — so
          # selecting on it would back up the volume's contents while silently
          # dropping the PVC object needed to restore them. That asymmetry is
          # the same shape as the bug this schedule replaces; verify with
          # `kubectl get pvc -n monitoring <name> -o jsonpath='{.metadata.labels}'`
          # before changing it.
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
