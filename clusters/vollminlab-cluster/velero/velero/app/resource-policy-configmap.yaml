apiVersion: v1
kind: ConfigMap
metadata:
  # Name is historical — this policy now covers more than SMB. Renaming it would
  # require updating the three `resourcePolicy.name` refs in configmap.yaml in
  # lockstep, so the name is kept and the scope documented here instead.
  name: velero-skip-smb-policy
  namespace: velero
  labels:
    app: velero
    env: production
    category: storage
data:
  policy.yaml: |
    version: v1
    volumePolicies:
      # Volumes already protected by VolSync, which is offsite-first (restic to B2)
      # and has a shorter RPO than the nightly Velero pass. Without this they were
      # copied 3-4x every night — once by VolSync, then again by Velero FSB into
      # BOTH the MinIO 96h tier and the B2 2160h tier — while pvc-minecraft-datadir
      # (the 20Gi world save) and harbor-db pgdata were copied by neither. The
      # overlap was accidental, not a division of labour.
      #
      # pvcLabels was verified on this cluster before being relied on: velero
      # v1.18.1, a probe backup of `portainer` produced 1 PodVolumeBackup without the
      # label and 0 with it. An unsupported condition would have been silently
      # ignored and the backup would still have reported Completed.
      #
      # The label lives on the PVC manifests in git, so wiring a new VolSync source
      # is one edit next to the PVC rather than a pod annotation somewhere else.
      #
      # For a PVC the app's chart templates rather than git — harbor-registry is
      # the only one — the label is applied by a `postRenderers` kustomize patch
      # on the HelmRelease. See harbor/harbor/app/helmrelease.yaml for why that,
      # and not `existingClaim`.
      - conditions:
          pvcLabels:
            backup.vollminlab.com/volsync: "true"
        action:
          type: skip

      # NAS shares — backed up by TrueNAS itself, not by Velero.
      - conditions:
          storageClass:
            - smb
        action:
          type: skip

      # emptyDir is scratch space by definition: the kubelet deletes it when the
      # pod is removed, so a restored pod can never receive its contents. Backing
      # it up produces no recoverable data and is the single largest source of
      # PodVolumeBackup failures on this cluster:
      #
      #   * "error identifying unique volume path on host" — the pod's
      #     /host_pods/<uid> tree disappears mid-run (CNPG failovers, tf-runner
      #     Jobs completing). Every volume of that pod fails together.
      #   * "pods <x> not found" — same cause, later in the sequence.
      #
      # Measured 2026-08-11: of the FSB volumes Velero would attempt cluster-wide,
      # 27 are live emptyDir and ~48 more are emptyDir already suppressed by
      # per-app `backup.velero.io/backup-volumes-excludes` annotations, against
      # 44 real PVCs. So ~63% of all FSB work was ephemeral scratch. Removing it
      # also shortens the backup window, which is the mitigation for the nightly
      # PSI I/O-stall (node-agent loadConcurrency is already pinned at 1 — see
      # configmap.yaml).
      #
      # This supersedes the per-app annotation approach used in PRs #1009, #1033,
      # #1034 and #1035. Those annotations are now redundant but harmless; leave
      # them until a separate cleanup PR.
      #
      # Only emptyDir is listed. Velero's FSB path already skips hostPath, secret,
      # configMap, projected and downwardAPI volumes unconditionally
      # (pkg/util/podvolume/pod_volume.go GetVolumesByPod, v1.18.1), so listing
      # them here would be dead configuration.
      #
      # PVC-backed volumes are deliberately NOT skipped — pgdata, registry-data,
      # config, metadata, media and datadir hold real state.
      #
      # `backupdir` was listed here as PVC-backed. It is not: it is an emptyDir on
      # the minecraft Deployment, so this rule skips it. That is correct, and it
      # costs nothing — verified 2026-08-22 that NOTHING writes to it. The itzg
      # chart mounts /backups by default, but the pod runs a single container with
      # no BACKUP* env vars, so the in-server backup feature was never enabled.
      # There are no rotated world backups being discarded, because none are taken.
      #
      # The live world IS protected: `datadir` is a PVC and is backed up nightly.
      # What does not exist is in-game rollback to an earlier point — see #1159.
      - conditions:
          volumeTypes:
            - emptyDir
        action:
          type: skip
