apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: velero-pvb-healer
resources:
  - rbac.yaml
  - cronjob.yaml
configMapGenerator:
  - name: velero-pvb-healer-script
    files:
      - heal.sh
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app: velero-pvb-healer
    env: production
    category: storage
