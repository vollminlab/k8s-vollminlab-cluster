apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-board
  namespace: fantasy
  labels:
    app: auction-board
    env: production
    category: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auction-board
  template:
    metadata:
      labels:
        app: auction-board
        env: production
        category: apps
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.5-alpine
          ports:
            # nginx-unprivileged listens on 8080, not 80 -- it cannot bind a
            # privileged port as uid 101. This is the container port the
            # NetworkPolicy must use, since policy is evaluated post-DNAT.
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: site
          configMap:
            name: auction-board-site
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
