apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auction-board-ingress
  namespace: fantasy
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-proxy.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://authentik.vollminlab.com/outpost.goauthentik.io/start?rd=https://$http_host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
    # Required: the outpost matches the request to a provider via
    # X-Forwarded-Host. Without it nginx sends its own service Host and the
    # outpost returns 400, which nginx surfaces as a 500.
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
    shlink.vollminlab.com/slug: thecoldwar
  labels:
    app: auction-board
    env: production
    category: apps
spec:
  ingressClassName: nginx
  rules:
    - host: thecoldwar.vollminlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auction-board
                port:
                  number: 80
  tls:
    - hosts:
        - thecoldwar.vollminlab.com
      secretName: wildcard-tls
