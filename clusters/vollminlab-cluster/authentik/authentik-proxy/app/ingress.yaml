# Routes /outpost.goauthentik.io on each forward_single host to the outpost, so the
# per-host start and callback URLs reach it. Without this the callback hits the
# app's own auth-annotated Ingress: the outpost lets /outpost.goauthentik.io paths
# through without serving them, nginx proxies the callback to the app, and the
# login never completes.
# Hosts here must match the forward_single providers in
# terraform/authentik/providers_proxy.tf. Path-split, so no shlink slug.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-proxy-callback-ingress
  namespace: authentik
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
  labels:
    app: authentik-proxy
    env: production
    category: security
spec:
  ingressClassName: nginx
  rules:
    - host: filebrowser.vollminlab.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-proxy
                port:
                  number: 9000
    - host: foundry.vollminlab.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-proxy
                port:
                  number: 9000
