apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
  labels:
    app: authentik-db
    env: production
    category: security
spec:
  instances: 1
  # Sized from 14d measured usage (p95 601Mi, peak 932Mi, cpu p95 106m).
  # Without this block the instance pods are BestEffort -- the first QoS class the
  # kubelet evicts under node memory pressure, and the highest oom_score_adj for the
  # node OOM killer. Kyverno's require-resources never flagged it because that policy
  # matches Deployment/StatefulSet/DaemonSet and CNPG creates bare Pods.
  # Request sits above p95 so the scheduler reserves what is actually used; the limit
  # carries the headroom. No CPU limit, per this cluster's policy.
  resources:
    requests:
      cpu: 150m
      memory: 768Mi
    limits:
      memory: 1536Mi
  inheritedMetadata:
    labels:
      app: authentik-db
      env: production
      category: security
  storage:
    size: 10Gi
    storageClass: longhorn
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-credentials
      postInitSQL:
        - GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO authentik
        - GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO authentik
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO authentik
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO authentik
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/authentik-db"
      endpointURL: "http://minio.minio.svc.cluster.local:9000"
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "7d"
