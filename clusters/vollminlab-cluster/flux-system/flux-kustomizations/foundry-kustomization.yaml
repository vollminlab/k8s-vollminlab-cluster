apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundry
  namespace: flux-system
  labels:
    app: foundry
    env: production
    category: gaming
spec:
  interval: 10m
  path: ./clusters/vollminlab-cluster/foundry
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: external-secrets
