apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: triage
  namespace: flux-system
  labels:
    app: triage
    env: production
    category: observability
spec:
  interval: 10m
  path: ./clusters/vollminlab-cluster/triage
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: external-secrets
