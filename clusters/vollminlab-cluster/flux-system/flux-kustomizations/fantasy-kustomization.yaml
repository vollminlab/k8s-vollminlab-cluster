apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fantasy
  namespace: flux-system
  labels:
    app: auction-board
    env: production
    category: apps
spec:
  interval: 10m
  path: ./clusters/vollminlab-cluster/fantasy
