apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-mount-healer
  namespace: kube-system
  labels:
    app: longhorn-mount-healer
    env: production
    category: storage
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # */10 schedule: 540s < the 600s interval. Observed runtime 46-50s.
      activeDeadlineSeconds: 540
      ttlSecondsAfterFinished: 3600
      # backoffLimit 2 (not 0): the heal script never self-fails (set -u, every
      # path returns 0 — even a detach timeout only logs + emits an event), so a
      # Failed job is always external pod death — almost always the descheduler
      # LowNodeUtilization plugin evicting this tiny Burstable pod off a hot node.
      # With backoffLimit 0 that single eviction => Failed job => KubeJobFailed
      # noise. The script is idempotent and restore_orphans repairs any interrupted
      # heal on the next run, so retrying is safe; a genuine persistent breakage
      # (RBAC/image-pull) still exhausts retries and alerts.
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: longhorn-mount-healer
            env: production
            category: storage
        spec:
          serviceAccountName: longhorn-mount-healer
          restartPolicy: Never
          containers:
            - name: longhorn-mount-healer
              image: docker.io/alpine/kubectl:1.33.4
              command: ["/bin/sh", "/scripts/heal.sh"]
              env:
                - name: HEAL_NAMESPACES
                  value: "mediastack monitoring harbor minio"
                - name: RESTART_THRESHOLD
                  value: "5"
                - name: COOLDOWN_SECONDS
                  value: "21600"
                - name: DETACH_TIMEOUT_SECONDS
                  value: "180"
                - name: POLL_INTERVAL_SECONDS
                  value: "5"
                - name: DRY_RUN
                  value: "false"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  # 98% CFS throttling at 100m — the healer must react fast during mount incidents
                  cpu: 300m
                  memory: 64Mi
          volumes:
            - name: script
              configMap:
                name: longhorn-mount-healer-script
