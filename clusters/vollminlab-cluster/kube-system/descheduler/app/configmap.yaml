apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler-values
  namespace: kube-system
  labels:
    app: descheduler
    env: production
    category: core
data:
  values.yaml: |
    kind: CronJob
    schedule: "*/30 * * * *"

    podLabels:
      app: descheduler
      env: production
      category: core

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    deschedulerPolicy:
      # Only balance across worker nodes. The 3 control-plane nodes are the only
      # nodes ever "underutilized" by requests, so without this selector nodeFit
      # picks them as the sole eviction targets — and every candidate is then
      # skipped because it doesn't tolerate the control-plane taint (evictedPods=0).
      nodeSelector: "!node-role.kubernetes.io/control-plane"
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                podProtections:
                  defaultDisabled:
                    - "PodsWithLocalStorage"
                  # Never evict a pod backed by a PVC. Evicting a Longhorn/CNPG
                  # RWO volume forces a detach/reattach = cold remount → CSI fsck,
                  # which can detonate latent ext4 corruption (see storage.md).
                  # The descheduler only rebalances stateless pods.
                  extraEnabled:
                    - "PodsWithPVC"
                nodeFit: true
                # Exclude the velero namespace entirely. Velero's node-agent exposes
                # non-CSI-snapshot volumes for FSB kopia backup via an ephemeral
                # hostPath-mounted "hosting" pod — these have no PVC, so the PVC
                # guard above doesn't protect them. An eviction mid-backup hard-fails
                # the PodVolumeBackup (2026-08-08: killed 2/3 Jellyfin PVBs, looped
                # the 3rd for 20+ minutes with zero progress). Only PodsWithLocalStorage
                # protection (disabled cluster-wide, see above) would have covered this,
                # so scope the fix to the one namespace instead.
                namespaceLabelSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: NotIn
                      values:
                        - velero
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 75
                  memory: 55
                  pods: 45
                targetThresholds:
                  # Raised 80 -> 90 on 2026-08-17. Same failure as the memory note
                  # below, recurring on the other axis: CPU *requests* on the general
                  # workers sit at w01 71%, w02 75%, w03 81%, w04 86%, so w03 and w04
                  # were permanently over an 80% target. The only general node under
                  # every underutilized threshold is w01 at 71% — w05/w06 are DMZ
                  # nodes with a NoSchedule taint that nodeFit cannot place onto — so
                  # there was nowhere to converge TO. The descheduler evicted 8-10
                  # pods every 30-minute cycle, the scheduler put them back on equally
                  # full nodes, and the loop repeated indefinitely.
                  #
                  # That churn was not harmless: it cycled kube-state-metrics every
                  # 30 minutes, which changes the series identity of every pod-less
                  # KSM metric and made KubeJobFailed flap firing/resolved against a
                  # Job whose state never changed (fixed separately in #1081).
                  #
                  # 90% is above w04's current 86% and is not masking real pressure:
                  # measured actual CPU usage is 9% on w03 and 39% on w04 against
                  # those 81%/86% requests. The requests are oversubscribed, which is
                  # a right-sizing question (cf. #928), not something eviction can fix.
                  cpu: 90
                  # w03 carries a heavy immovable stateful floor (authentik-server +
                  # 3 CNPG DBs + minio) that pins its request-memory at ~70%. With the
                  # PVC guard the descheduler can only move stateless pods, so a 70%
                  # target left w03 perpetually classified overutilized — it evicted
                  # ~5 stateless pods every cycle without ever converging below target
                  # (churn, no benefit). 80% clears the normal stateful floor while
                  # still catching a node genuinely packed by requests. Actual usage
                  # on w03 is only ~55%, so this is not masking real pressure.
                  memory: 80
                  pods: 50
                # Hard ceiling on evictions per node per cycle. The two incidents above
                # were both "threshold set below an unreachable floor", and in both the
                # symptom was unbounded churn — 8-10 evictions every 30 minutes, with
                # no benefit. A threshold can be wrong again; this bounds the damage
                # when it is, and makes the wrongness visible as a slow drift instead
                # of a storm. Supported as a LowNodeUtilization arg in descheduler
                # v0.36.0 (chart 0.36.0).
                evictionLimits:
                  node: 2
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
            filter:
              enabled:
                - DefaultEvictor
