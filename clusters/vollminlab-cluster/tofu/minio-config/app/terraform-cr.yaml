---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: minio-config
  namespace: tofu
  labels:
    app: tofu-controller
    env: production
    category: core
spec:
  interval: 10m
  # TEMPORARY -- held on manual to review the aminueza/minio provider bump in
  # #1246 (v3.42.x -> v3.43.0). Under `auto` that PR would apply an unreviewed
  # plan within the 10m interval, which is what scripts/check-tofu-provider-approval.py
  # blocks. Reverted to `auto` immediately after the plan is approved; see
  # docs/runbooks/tofu-provider-bumps.md.
  approvePlan: ""
  path: ./terraform/minio
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  backendConfig:
    customConfiguration: |
      backend "s3" {
        bucket                      = "terraform-state"
        key                         = "minio/terraform.tfstate"
        region                      = "us-east-1"
        endpoint                    = "http://minio.minio.svc.cluster.local:9000"
        force_path_style            = true
        skip_credentials_validation = true
        skip_metadata_api_check     = true
        skip_region_validation      = true
      }
  backendConfigsFrom:
    - kind: Secret
      name: tofu-minio-credentials
  varsFrom:
    - kind: Secret
      name: minio-tf-credentials
