---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: authentik-config
  namespace: tofu
  labels:
    app: tofu-controller
    env: production
    category: core
spec:
  interval: 10m
  # approvePlan: auto applies each plan on the interval above -- the same posture as
  # the other 8 modules. The PR review is the review for ordinary config changes.
  #
  # Provider bumps are the exception and are NOT covered by this: a new provider can
  # rewrite resources it merely re-reads, and CI runs `tofu validate`, never
  # `tofu plan`. Two things hold that back -- the committed .terraform.lock.hcl pins
  # the version, and scripts/check-tofu-provider-approval.py fails any PR touching
  # versions.tf or .terraform.lock.hcl while this says "auto".
  #
  # So a Renovate provider PR arrives blocked by design. To land one, flip this to ""
  # temporarily and follow docs/runbooks/tofu-provider-bumps.md -- including why the
  # approval cannot be delivered through git.
  approvePlan: auto
  path: ./terraform/authentik
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  backendConfig:
    customConfiguration: |
      backend "s3" {
        bucket                      = "terraform-state"
        key                         = "authentik/terraform.tfstate"
        region                      = "us-east-1"
        endpoint                    = "http://minio.minio.svc.cluster.local:9000"
        force_path_style            = true
        skip_credentials_validation = true
        skip_metadata_api_check     = true
        skip_region_validation      = true
      }
  backendConfigsFrom:
    - kind: Secret
      name: tofu-minio-credentials
  varsFrom:
    - kind: Secret
      name: authentik-tf-credentials
    - kind: Secret
      name: authentik-oauth-client-secrets
    - kind: Secret
      name: portainer-tf-credentials
