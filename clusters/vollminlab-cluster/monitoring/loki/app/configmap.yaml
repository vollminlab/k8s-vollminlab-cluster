apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-values
  namespace: monitoring
  labels:
    app: loki
    env: production
    category: observability
data:
  values.yaml: |
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
        s3:
          endpoint: minio.minio.svc.cluster.local:9000
          insecure: true
          s3ForcePathStyle: true

      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      limits_config:
        retention_period: 720h
        # Query-side OOM guards (2026-10-20). Five of the six OOM kills since 10-15 came
        # seconds after one ad-hoc query that read 7.5-160 GB of chunks and took Loki from
        # 270-460 MiB to its limit in under 30s; the sixth was MinIO being down. A normal
        # full day across every namespace is 1.6-1.9 GB, and a normal 15m split ~20 MB.
        # Both limits are checked from the index before any chunk is fetched, so a query
        # over them is rejected with an error instead of killing the process. The ruler
        # evaluates locally and is not subject to them.
        max_query_bytes_read: 20GB      # whole query: ~10 normal days of everything
        max_querier_bytes_read: 1GB     # per 15m split: ~50x normal; a flood split is over it
        max_query_parallelism: 8
        tsdb_max_query_parallelism: 16

      querier:
        # Was 4. Each concurrent sub-query decompresses chunks into memory at once.
        max_concurrent: 2

      ingester:
        wal:
          # Was the 4GB default, four times the old container limit. Replay past this
          # flushes to the store instead of holding everything in memory.
          replay_memory_ceiling: 768MB

      compactor:
        retention_enabled: true
        delete_request_store: s3

      rulerConfig:
        alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        enable_api: true
        storage:
          type: local
          local:
            directory: /etc/loki/rules

    singleBinary:
      replicas: 1

      # Soft spread of the heavy monitoring set — see victoria-metrics values for
      # rationale (all heavy monitoring pods were stacked on k8sworker02). This
      # overrides the chart's default hard self-anti-affinity, which is moot at
      # replicas: 1; loki is included in the In-list below instead.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - prometheus
                        - loki
                        - grafana
                        - victoria-metrics-single

      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: loki-minio-credentials
              key: access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: loki-minio-credentials
              key: secret-key
        # Go's heap otherwise grows past the container limit before collecting; at 90%
        # of the limit it collects harder instead of being OOM-killed.
        - name: GOMEMLIMIT
          value: 1843MiB

      persistence:
        enabled: true
        storageClass: longhorn
        size: 5Gi

      # Measured 30d (2026-10-20): working set p50 476 / p99 610 MiB normally, p99 857 MiB
      # during the 10-15..17 log flood; query spikes finish inside one scrape interval, so
      # real peaks are higher. CPU sat at the 1-core limit (19.5% of periods throttled), and
      # a throttled process under GOMEMLIMIT spirals, so there is no CPU limit (kyverno.md).
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 2Gi

      podLabels:
        app: loki
        env: production
        category: observability

      extraVolumes:
        - name: ruler-rules
          configMap:
            name: loki-ruler-rules
      extraVolumeMounts:
        - name: ruler-rules
          mountPath: /etc/loki/rules/fake

    gateway:
      enabled: false

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    lokiCanary:
      enabled: false

    test:
      enabled: false
