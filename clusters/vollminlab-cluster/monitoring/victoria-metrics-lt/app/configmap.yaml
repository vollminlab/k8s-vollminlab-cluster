apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-lt-values
  namespace: monitoring
  labels:
    app: victoria-metrics-lt
    env: production
    category: observability
data:
  values.yaml: |
    # Cold tier: a SECOND victoria-metrics-single, ~13 months retention, on cheap
    # pool_0 spinning disk (local PV) — everything older than the hot tier's 30d
    # lives here, off Longhorn. Prometheus remoteWrite fans out to both instances.
    # Distinct service -> victoria-metrics-lt-server.monitoring.svc:8428
    fullnameOverride: victoria-metrics-lt

    server:
      # 395d = 13 months. At the measured ~1.63 GB/day this is ~645GB on-disk;
      # the 750Gi PV below has headroom.
      retentionPeriod: 395d

      # statefulSet: the RWO local PV is bound via a volumeClaimTemplate, avoiding
      # the rolling-update detach trap (same reason as the hot tier).
      mode: statefulSet

      persistentVolume:
        enabled: true
        # Binds the pre-created static local PV (storageclass.yaml + pv.yaml).
        storageClassName: local-vm-lt
        accessModes:
          - ReadWriteOnce
        size: 750Gi

      # Keeping this distinct from the hot tier's identity is deliberate: velero's
      # victoria-metrics-b2 schedule must never sweep this 750Gi cold volume into
      # a daily FSB pass.
      #
      # NOTE: the app key below does NOT survive — the chart sets its own
      # app=server on the pod, so both tiers end up labelled app=server and this
      # value only ever reaches env/category. The separation still holds, but it
      # holds by accident, via app.kubernetes.io/instance=victoria-metrics-lt.
      # Do not rely on the app key here for backup scoping.
      #
      # Backup for this tier is TrueNAS ZFS snapshots of the pool_0 dataset (4wk,
      # same pool as the data) PLUS an incremental vmbackup to Backblaze B2 — see
      # backup-cronjob.yaml. Not velero: FSB would re-walk the whole volume daily.
      podLabels:
        app: victoria-metrics-lt
        env: production
        category: observability

      resources:
        requests:
          cpu: 100m
          # Higher floor than the hot tier: year-range queries touch far more
          # blocks. Tune after observing real usage.
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi

      # Scrape VM's own /metrics so cold-tier health (ingestion rate, disk growth,
      # uptime) is visible in Grafana. Prometheus scrapes all ServiceMonitors.
      serviceMonitor:
        enabled: true
        extraLabels:
          app: victoria-metrics-lt
          env: production
          category: observability
