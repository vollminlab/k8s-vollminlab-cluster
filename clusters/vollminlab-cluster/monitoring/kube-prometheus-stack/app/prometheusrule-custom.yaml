apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vollminlab-custom-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    env: production
    category: observability
    release: kube-prometheus-stack
spec:
  groups:
    # Pre-aggregate high-cardinality control-plane histograms.
    # Raw series are retained for ~2h (head block); aggregates carry the long-term signal.
    # Drops: instance, scope, subresource, component, group, version — keeps verb+resource+le.
    - name: apiserver.recording.rules
      interval: 5m
      rules:
        - record: verb_resource:apiserver_request_duration_seconds_bucket:rate5m
          expr: |
            sum without (instance, scope, subresource, component, group, version) (
              rate(apiserver_request_duration_seconds_bucket{job="apiserver"}[5m])
            )

        - record: verb_resource:apiserver_request_sli_duration_seconds_bucket:rate5m
          expr: |
            sum without (instance, scope, subresource, component, group, version) (
              rate(apiserver_request_sli_duration_seconds_bucket{job="apiserver"}[5m])
            )

        - record: verb_resource:apiserver_watch_list_duration_seconds_bucket:rate5m
          expr: |
            sum without (instance, component, group, version) (
              rate(apiserver_watch_list_duration_seconds_bucket{job="apiserver"}[5m])
            )

    - name: etcd.recording.rules
      interval: 5m
      rules:
        - record: operation_type:etcd_request_duration_seconds_bucket:rate5m
          expr: |
            sum without (instance, grpc_service, grpc_method) (
              rate(etcd_request_duration_seconds_bucket{job="kube-etcd"}[5m])
            )

    - name: cert-manager
      rules:
        - alert: CertManagerCertificateExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires soon"
            description: "Certificate {{ $labels.name }} (namespace {{ $labels.namespace }}) expires in {{ $value | humanizeDuration }}."

        - alert: CertManagerCertificateExpiringCritical
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 24 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in < 24 hours"
            description: "Certificate {{ $labels.name }} (namespace {{ $labels.namespace }}) expires in {{ $value | humanizeDuration }}. Immediate action required."

    - name: velero
      rules:
        # velero_backup_last_successful_timestamp is a stable gauge — immune to pod restarts.
        # increase(velero_backup_attempt_total[26h]) was used previously but fires false positives
        # after any Velero pod restart (counter resets to 0, increase() returns 0 for the window).
        # This alert also covers Failed/PartiallyFailed runs, not just missing ones: the
        # timestamp only advances on a fully-Completed backup, so any bad nightly run leaves
        # it stale and this fires ~2h after the failed 03:00 run. It self-resolves on the
        # next Completed backup. There is deliberately no separate PartiallyFailed alert —
        # the old increase(velero_backup_partial_failure_total[26h]) form kept firing for a
        # full 26h after one bad run even when a later run succeeded, and there is no
        # per-run gauge to key on instead (velero_backup_last_status reports 1 for
        # PartiallyFailed — verified live 2026-07-19).
        - alert: VeleroBackupNotSucceeding
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule="velero-daily-full"} > 26 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Velero daily-full has had no successful backup in 26 hours"
            description: >-
              Last fully-successful daily-full backup was {{ $value | humanizeDuration }} ago —
              the nightly run failed, partially failed, or never ran. Check 'velero backup get'.
              Resolves on the next Completed backup.

        # last_status is 0 only when the most recent backup outright Failed (PartiallyFailed
        # reports 1). Gauge-based, so it resolves as soon as any later run does better —
        # unlike a counter increase() lookback, it never keeps alerting after recovery.
        - alert: VeleroBackupFailed
          expr: |
            velero_backup_last_status{schedule="velero-daily-full"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Velero daily-full backup failed"
            description: "The most recent daily-full backup Failed outright. Check 'velero backup get'. Resolves on the next non-Failed run."

        # Escalation guard. VeleroBackupNotSucceeding/VeleroBackupFailed are warnings that can be
        # tolerated for days — on 2026-07-02 a wedged InProgress backup left daily-full
        # PartiallyFailed for 4 days, silently pinning kopia blocks (maintenance can't GC an
        # in-use snapshot) until MinIO hit 100%. This fires critical when NO fully-successful
        # daily-full has completed in 72h, forcing action before a stuck/degraded backup fills
        # the volume. Reuses the restart-immune velero_backup_last_successful_timestamp gauge.
        - alert: VeleroBackupPersistentlyFailing
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule="velero-daily-full"} > 72 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Velero daily-full has had no successful backup in 72 hours"
            description: >-
              Last fully-successful daily-full backup was {{ $value | humanizeDuration }}
              ago — a backup may be wedged InProgress or repeatedly PartiallyFailed. A
              stuck backup blocks kopia GC and will fill MinIO. Check 'velero backup get'
              and repo maintenance.

        # Same escalation guard for the off-site daily-b2 schedule. daily-b2 shares the
        # same failure surface (a wedged/PartiallyFailed backup pins kopia blocks the B2
        # repo's full maintenance can't GC) — it just fills Backblaze instead of MinIO,
        # and leaves the retention tier stale. daily-b2 has its own 72h guard because a
        # per-schedule threshold is required: monthly-b2 legitimately runs monthly, so it
        # can't share this alert (its last-success age exceeds 72h by design).
        - alert: VeleroB2BackupPersistentlyFailing
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule="velero-daily-b2"} > 72 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Velero daily-b2 has had no successful backup in 72 hours"
            description: >-
              Last fully-successful daily-b2 (off-site Backblaze) backup was
              {{ $value | humanizeDuration }} ago — a backup may be wedged InProgress or
              repeatedly PartiallyFailed, pinning kopia blocks in B2 and leaving the
              off-site retention tier stale. Check 'velero backup get' and repo maintenance.

        - alert: KubeJobFailed
          # Aggregated with `max by (namespace, job_name)` so the alert's identity does
          # not include the kube-state-metrics pod that happened to report it.
          #
          # kube_job_failed has no `pod` label of its own, so the scrape target's `pod`
          # and `instance` labels land on the series. Every time the KSM pod is replaced
          # the series identity changes: the old one goes stale (alert RESOLVES) and a
          # new one appears (alert FIRES) — while the underlying failed Job never changed.
          # On 2026-08-17 the descheduler was cycling KSM every 30 minutes, so a single
          # persistently-failed Job produced 7 distinct ALERTS series in 6 hours and
          # flapped continuously.
          #
          # This does NOT affect KSM metrics that carry their own `pod` label
          # (kube_pod_status_ready and friends) — there the subject pod wins and the
          # series is stable. Only pod-less KSM metrics need this treatment; the other
          # one on this cluster is kube_cronjob_status_last_successful_time, fixed the
          # same way in prometheusrule-gitops.yaml.
          expr: |
            max by (namespace, job_name) (kube_job_failed{namespace!="velero"}) > 0
              or
            max by (namespace, job_name) (kube_job_failed{namespace="velero", job_name!~".*-kopia-maintain.*"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete"
            description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed. Removing failed job after investigation should clear this alert."

        - alert: VeleroBackupMetricMissing
          expr: |
            absent(velero_backup_last_status{schedule="velero-daily-full"}) == 1
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Velero daily-full backup metric absent — Velero may not be running"
            description: "velero_backup_last_status for schedule=velero-daily-full is missing. Velero may be down or metrics scraping has failed."

        # --- Coverage for the two unwatched schedules -----------------------------
        # Added 2026-08-19. Every rule above pins schedule="velero-daily-full" (4 of
        # them) or "velero-daily-b2" (1), leaving velero-grafana-b2 and
        # velero-monthly-b2 with no alerting at all. grafana-b2 is the one that
        # matters most: grafana.db holds UI-created dashboards, users and API keys
        # that exist nowhere else, and it was the only copy nothing watched.

        # Schedule-agnostic failure catch. No time threshold needed -- a reported
        # failure is a failure whatever the cadence -- so this covers monthly-b2 too,
        # where any staleness threshold would have to be over a month wide.
        - alert: VeleroAnyBackupFailed
          expr: |
            velero_backup_last_status == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Velero backup failed for schedule {{ $labels.schedule }}"
            description: >-
              The most recent backup for schedule={{ $labels.schedule }} reported failure. This rule is deliberately not pinned to a schedule name so new schedules
              are covered the day they are created.
        - alert: VeleroGrafanaBackupStale
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule="velero-grafana-b2"} > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Velero grafana-b2 backup is stale"
            description: "velero-grafana-b2 last succeeded {{ $value | humanizeDuration }} ago (threshold 26h). grafana.db holds dashboards, users and API keys that are not reproducible from git."
        # Monthly cadence: threshold set to 32 days, matching the 768h override the
        # velero-backup-content-guard CronJob already applies to this schedule.
        - alert: VeleroMonthlyBackupStale
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule="velero-monthly-b2"} > 768 * 3600
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Velero monthly-b2 backup is stale"
            description: "velero-monthly-b2 last succeeded {{ $value | humanizeDuration }} ago (threshold 32d, matching the content guard's 768h override for this schedule)."

    - name: node-disk
      rules:
        - alert: NodeDiskSpaceLow
          expr: |
            (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) < 0.20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} root disk below 20% free"
            description: "Node {{ $labels.instance }} has {{ $value | humanizePercentage }} free on root filesystem. Check with: df -h on the node."

        - alert: NodeDiskSpaceCritical
          expr: |
            (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) < 0.10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} root disk below 10% free"
            description: "Node {{ $labels.instance }} has {{ $value | humanizePercentage }} free on root filesystem. Immediate action required."

    # Memory-gated replacement for the stock node-exporter NodeMemoryMajorPagesFaults
    # rule (disabled via defaultRules.disabled in configmap.yaml). The stock rule alerts
    # on the major-fault RATE alone (rate(node_vmstat_pgmajfault[5m]) > 500 for 15m). On
    # k8sworker03 that rate sits chronically at ~800-1300/s purely from qbittorrent
    # torrent disk I/O refaulting the page cache — while the node has ~36% memory free.
    # That is a benign I/O signature, not memory exhaustion, so the stock alert was a
    # standing false positive whose own text ("check that there is enough memory
    # available") contradicted the node's actual state. Adding the MemAvailable < 15%
    # conjunction makes it fire only when high fault rate coincides with genuinely low
    # available memory — the real memory-starvation thrash the alert is meant to catch
    # (which inherently drives MemAvailable down as reclaim churns). I/O-driven fault
    # storms on a node with ample free memory no longer trip it.
    - name: node-memory
      rules:
        - alert: NodeMemoryMajorPagesFaults
          expr: |
            (rate(node_vmstat_pgmajfault{job="node-exporter"}[5m]) > 500)
              and on(instance)
            (
              node_memory_MemAvailable_bytes{job="node-exporter"}
                / node_memory_MemTotal_bytes{job="node-exporter"} < 0.15
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Memory major page faults are occurring at very high rate."
            description: >-
              Memory major pages are occurring at very high rate at {{ $labels.instance }}
              ({{ printf "%.0f" $value }} major faults/s over the last 15 minutes) while
              available memory on the node is below 15%. The node is likely thrashing on
              genuine memory pressure — check workloads and memory requests on this node.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodememorymajorpagesfaults

    - name: pod-health
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace!~"trivy-system|velero"}[30m]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value | printf \"%.0f\" }} times in the last 30 minutes."

        # Escalated sibling of PodCrashLooping, scoped to the namespaces the longhorn-mount-healer
        # CronJob (kube-system) covers. The healer runs */10 and clears a stale Longhorn mount via
        # scale-0 -> wait-detached -> scale-up within ~10-20m; a fresh pod after a heal resets this
        # counter. A crashloop still accruing restarts an hour later means the automated cure did
        # not take -- a detach timeout (HealedStaleMountTimeout) or the healer's 6h per-workload
        # cooldown suppressing what is actually an application bug. Either way a human is needed.
        # NOTE: keep this namespace regex in sync with the healer's HEAL_NAMESPACES allowlist
        # (clusters/vollminlab-cluster/kube-system/longhorn-mount-healer/app/heal.sh).
        - alert: StorageHealerNotCoping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"mediastack|monitoring|harbor"}[1h]) > 6
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Self-healer not coping: {{ $labels.namespace }}/{{ $labels.pod }} still crash-looping"
            description: >-
              Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
              has restarted {{ $value | printf "%.0f" }} times in the last hour and is still
              crash-looping past the longhorn-mount-healer window. The automated scale-0 ->
              wait-detached -> scale-up cure has not resolved it. Check
              `kubectl get events -n {{ $labels.namespace }} --field-selector reason=HealedStaleMountTimeout`
              (the healer emits this in the affected namespace) and the healer CronJob logs
              (`kubectl logs -n kube-system -l app=longhorn-mount-healer --tail=100`); if it
              is a stale Longhorn mount, run the manual runbook (scale the Deployment to 0,
              wait for the Longhorn volume to report detached, scale it back up).

        # Escalated sibling of PodCrashLooping for user-facing namespaces: a crashloop
        # still accruing restarts after 30 minutes there is an outage in progress, not a
        # transient blip. severity=critical routes to the priority-1 Pushover receiver
        # (route lives in the "Alertmanager Config" 1Password item), which repeats every
        # 4h instead of 12h. The plain PodCrashLooping warning keeps firing alongside —
        # this adds escalation, it suppresses nothing. Context: the 2026-07-13 shlink
        # crashloop ran ~30h because it only ever surfaced as a quiet priority-0 warning.
        - alert: UserFacingPodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"shlink|mediastack|homepage|authentik"}[30m]) > 3
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "User-facing pod {{ $labels.namespace }}/{{ $labels.pod }} crash-looping for 30m+"
            description: >-
              Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
              has restarted {{ $value | printf "%.0f" }} times in the last 30 minutes and the
              loop has persisted past the 30-minute escalation window. Treat as a user-facing
              outage: check `kubectl describe pod` and recent events in the namespace, and if
              it is a stale Longhorn mount follow the scale-0 -> wait-detached -> scale-up
              runbook.

        - alert: PodNotReady
          expr: |
            (
              kube_pod_status_ready{condition="true",namespace!~"trivy-system|velero",pod!~"volsync-src-.*"} == 0
            ) unless on(pod, namespace)
              kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 15 minutes."

    - name: longhorn
      rules:
        - alert: LonghornVolumeDegraded
          expr: |
            longhorn_volume_robustness{state="degraded"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc }} ({{ $labels.pvc_namespace }}) is degraded"
            description: "Volume {{ $labels.volume }} (PVC {{ $labels.pvc }}/{{ $labels.pvc_namespace }}) degraded 10+ min. A replica may be rebuilding or a node is unhealthy."

        - alert: LonghornVolumeFaulted
          expr: |
            longhorn_volume_robustness{state="faulted"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.pvc }} ({{ $labels.pvc_namespace }}) is faulted"
            description: "Volume {{ $labels.volume }} backing PVC {{ $labels.pvc }} in {{ $labels.pvc_namespace }} is faulted. Data may be inaccessible."

        # A replica stranded mid-rebuild. Longhorn can leave a replica with healthyAt
        # unset indefinitely: a stale "is rebuilding" flag on an ALREADY-healthy peer
        # blocks the pre-rebuild snapshot purge, so the new replica never starts. The
        # orphan holds no data (absent from the engine replicaModeMap) and nothing in
        # Longhorn ever reaps it.
        #
        # LonghornVolumeDegraded cannot see this. With spec.numberOfReplicas=3 and 3
        # replicas RW, the volume reports *healthy* most of the time even though a 4th
        # orphan CR exists; it only flips to degraded while something surges the spec.
        # Measured 2026-08-24 over the 24h before the fix, the volume that had been
        # stuck for 51h was degraded just 4.9% of the window, ranking below `minio`
        # (33%) and `pvc-filebrowser-config` (6.3%) — both merely rebalancing normally.
        # Time-in-degraded is therefore not a usable signal; the replica CR is.
        #
        # A healthy rebuild here completes in ~51s (measured, 2Gi volume), so 1h is
        # ~70x headroom and cannot fire on normal rebalancing churn.
        # Runbook: .claude/rules/storage.md + the surge-move loop in
        # vollminlab/longhorn-rebalancing-controller#22.
        - alert: LonghornReplicaStuckRebuilding
          expr: |
            longhorn_crd_replica_info{healthy_at="", failed_at="", active="true"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn replica {{ $labels.replica }} has never become healthy"
            description: >-
              Replica {{ $labels.replica }} of volume {{ $labels.volume }} on node
              {{ $labels.node }} has had healthyAt unset for over an hour, so it is
              stranded mid-rebuild rather than slow. Confirm with a large and still-growing
              `count` on the FailedStartingSnapshotPurge event for that volume's engine
              (`kubectl get events -n longhorn-system --field-selector reason=FailedStartingSnapshotPurge`);
              the IP in that error maps to an already-healthy RW replica, not this one.
              Fix: patch spec.numberOfReplicas back to the intended count, then delete this
              replica CR explicitly — it survives the patch — and clear any
              rebalancer.vollminlab.com/move-* annotations left on the volume.

        - alert: LonghornNodeStorageLow
          expr: |
            (longhorn_node_storage_capacity_bytes - longhorn_node_storage_usage_bytes)
              / longhorn_node_storage_capacity_bytes < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node {{ $labels.node }} storage below 15% free"
            description: "Longhorn storage node {{ $labels.node }} has less than 15% free. New replicas may fail to schedule. Expand the disk or evict replicas."

        # Reclaim-path outcome check. Longhorn is thin-provisioned and only learns a
        # block is free when the filesystem discards it, so `actualSize` drifts above
        # real usage until the daily filesystem-trim RecurringJob runs.
        #
        # CronJobNotSucceededRecently (prometheusrule-gitops.yaml) already covers the
        # job dying. It does NOT cover the job *succeeding while doing nothing*, which
        # is exactly what happened on 2026-08-17: Longhorn 1.12.1 shipped a
        # NetworkPolicy that blocked the old trim CronJob's API calls, and it logged
        # "trimmed 0 volumes" and exited 0 every night (#1086). This alert watches the
        # outcome instead of the mechanism, so it catches any future failure of the
        # reclaim path regardless of cause.
        #
        # kubelet reports one series per node for RWX volumes (pvc-completed-downloads
        # is mounted on several), so the right-hand side MUST be aggregated with
        # `max by` — an unaggregated join fails with "many-to-many matching not allowed"
        # rather than returning a wrong number.
        #
        # Threshold: measured floor after a working trim is ~26GB, which is space held
        # by the deliberately retained snapshots of snapshot-retention (retain: 3), not
        # waste. It was 67GB with trim broken. 60GB sits above the floor and below the
        # broken state; revisit if snapshot retention changes.
        - alert: LonghornStaleSpaceHigh
          expr: |
            sum(
              longhorn_volume_actual_size_bytes
              - on (pvc_namespace, pvc) group_left()
                max by (pvc_namespace, pvc) (
                  label_replace(
                    label_replace(
                      kubelet_volume_stats_used_bytes,
                      "pvc_namespace", "$1", "namespace", "(.+)"
                    ),
                    "pvc", "$1", "persistentvolumeclaim", "(.+)"
                  )
                )
            ) > 60e9
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn is holding {{ $value | humanize1024 }}B more than its filesystems use"
            description: >-
              Longhorn allocated size exceeds live filesystem usage cluster-wide by
              {{ $value | humanize1024 }}B, above the ~26GB expected from retained
              snapshots. The daily filesystem-trim RecurringJob is probably running but
              reclaiming nothing — check that it logs per-volume "Running recurring
              filesystem trim" lines, not just a successful exit:
              `kubectl logs -n longhorn-system -l job-name=<latest filesystem-trim job>`.

    - name: minio
      rules:
        - alert: MinioDiskUsageHigh
          expr: |
            kubelet_volume_stats_available_bytes{namespace="minio"}
              / kubelet_volume_stats_capacity_bytes{namespace="minio"} < 0.20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "MinIO PVC {{ $labels.persistentvolumeclaim }} below 20% free"
            description: "MinIO PVC {{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free. Review Velero backup TTLs, Loki retention, and kopia GC status."

        - alert: MinioDiskUsageCritical
          expr: |
            kubelet_volume_stats_available_bytes{namespace="minio"}
              / kubelet_volume_stats_capacity_bytes{namespace="minio"} < 0.10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "MinIO PVC {{ $labels.persistentvolumeclaim }} below 10% free"
            description: "MinIO PVC {{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free. Immediate action required — node kubelet eviction threshold is ~10-15%."

    # The TrueNAS media pool backs /movies and /tv over SMB and holds ~8 TB of library.
    # Nothing else watches it: node-exporter only sees host filesystems, and the shares
    # are mounted inside pods via the SMB CSI driver, so they never appear in
    # node_filesystem_*. The existing disk alerts cover VMware datastores, Longhorn and
    # MinIO — none of them this pool.
    #
    # Source is the exportarr sidecars already running in radarr and sonarr, which surface
    # the arr's own /api/v3/diskspace. Both root folders report the same underlying pool,
    # so the two series track together; alerting on min() over both means a single alert
    # regardless of which app notices first, and it still fires if one exporter is down.
    #
    # Thresholds are absolute, not percentages: the two SMB shares advertise different
    # capacities (16T vs 18T) for one shared pool, so a percentage is meaningless here.
    #
    # This matters now that Radarr/Sonarr upgrades are enabled (#1090/#1092): 274 movies
    # and 3,005 episodes sit below cutoff. Per-quality size ceilings bound each file, not
    # the total, so the aggregate ceiling exceeds free space if it ever ran to completion.
    - name: media-pool
      rules:
        - alert: MediaPoolSpaceLow
          expr: |
            min(
              radarr_rootfolder_freespace_bytes
              or sonarr_rootfolder_freespace_bytes
            ) < 2199023255552
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS media pool below 2 TiB free"
            description: >-
              The pool behind /movies and /tv has {{ $value | humanize1024 }}B free.
              Check the Radarr and Sonarr queues for an upgrade backlog, and confirm
              nobody has run "Search for Cutoff Unmet" — that queues every below-cutoff
              item at once.

        - alert: MediaPoolSpaceCritical
          expr: |
            min(
              radarr_rootfolder_freespace_bytes
              or sonarr_rootfolder_freespace_bytes
            ) < 805306368000
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS media pool critically low — take action now"
            description: >-
              The pool behind /movies and /tv has {{ $value | humanize1024 }}B free.
              Pause the Radarr/Sonarr queues and SABnzbd before imports start failing
              mid-write.

        # The alerts above are blind if the exporters stop reporting, and a silent
        # exporter looks identical to a healthy pool. Watch for the series disappearing.
        - alert: MediaPoolSpaceMetricMissing
          expr: |
            absent(radarr_rootfolder_freespace_bytes)
              or absent(sonarr_rootfolder_freespace_bytes)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Media pool free-space metric has stopped reporting"
            description: >-
              radarr_rootfolder_freespace_bytes or sonarr_rootfolder_freespace_bytes is
              absent, so MediaPoolSpaceLow/Critical cannot fire. Check the exportarr
              sidecar in the radarr and sonarr pods and the radarr-metrics /
              sonarr-metrics ServiceMonitors.

    # Harbor is on the image-pull critical path: all 9 nodes proxy docker.io through
    # the Harbor proxy cache, so an unhealthy Harbor blocks new pod scheduling
    # cluster-wide once local image caches miss. Metrics come from the harbor-exporter
    # enabled in the harbor chart values (metrics.enabled + serviceMonitor).
    - name: harbor
      rules:
        # harbor_health is the exporter's overall status gauge (1 healthy / 0 not).
        # critical because of the image-pull blast radius described above.
        - alert: HarborUnhealthy
          expr: |
            harbor_health == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Harbor is reporting unhealthy"
            description: >-
              Harbor's aggregate health check has been failing for 10+ minutes. Image
              pulls through the docker.io proxy cache will start failing once node-local
              caches miss. Check component status with the HarborComponentUnhealthy
              alert / harbor_up, and `kubectl get pods -n harbor`.

        # Per-component gauge (component ∈ core/database/jobservice/portal/redis/
        # registry/registryctl/trivy). Warning-level early signal — a single sick
        # component (e.g. trivy) does not necessarily break pulls.
        - alert: HarborComponentUnhealthy
          expr: |
            harbor_up == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Harbor component {{ $labels.component }} unhealthy"
            description: >-
              Harbor component {{ $labels.component }} has been reporting unhealthy for
              15+ minutes. Registry pulls may still work; investigate before it
              escalates to HarborUnhealthy.

        # Weekly registry GC (tofu harbor-config: Sat 05:00 UTC) guards the 5Gi
        # registry PVC — GC silently never running is what filled it to 91% on
        # 2026-07-22. Label values verified against goharbor/harbor source
        # (src/jobservice/runner/redis.go): type is the job name
        # "GARBAGE_COLLECTION", status is one of success/fail/stop.
        - alert: HarborGarbageCollectionFailed
          expr: |
            increase(harbor_jobservice_task_total{type="GARBAGE_COLLECTION",status="fail"}[24h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Harbor garbage collection failed"
            description: >-
              A Harbor GC job failed within the last 24h. The registry PVC is small
              (8Gi, intentionally); check the GC run log in Harbor (Administration ->
              Clean Up -> Garbage Collection) and the jobservice pod logs.

        # Registry-fill detector (replaces the old increase()-based
        # HarborGarbageCollectionMissing, which was a false positive). The GC
        # counter harbor_jobservice_task_total lives on the jobservice pod and
        # RESETS on every pod restart, and it is only exported *after* its first
        # increment — so a healthy weekly GC leaves the success series flat at 1
        # and increase(...[8d]) reads 0 (the absent->1 arming edge is invisible),
        # firing for ~a week after any jobservice restart even though GC ran.
        # There is no last-GC-timestamp gauge in Harbor metrics, so guard the
        # actual risk instead — the registry PVC filling (what GC stopping
        # would cause). Reset-immune, same pattern as the MinIO PVC alerts above.
        # HarborGarbageCollectionFailed (above) still catches explicit failures.
        # 2026-08-10: the PVC was 5Gi against a ~3.4 GiB live working set, so this
        # alert re-fired within days of every GC. Volume raised to 8Gi (capped by
        # k8sworker06's Longhorn scheduling headroom, not by need); at that size
        # 20% free is a genuine growth signal, not steady-state noise.
        - alert: HarborRegistryVolumeFilling
          expr: |
            kubelet_volume_stats_available_bytes{namespace="harbor",persistentvolumeclaim="harbor-registry"}
              / kubelet_volume_stats_capacity_bytes{namespace="harbor",persistentvolumeclaim="harbor-registry"} < 0.20
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Harbor registry PVC below 20% free"
            description: >-
              The 8Gi harbor-registry PVC has {{ $value | humanizePercentage }} free.
              Weekly GC (Sat 05:00 UTC, harbor-config tofu) may have stopped reclaiming
              blobs. Check the GC run log (Administration -> Clean Up -> Garbage
              Collection) and jobservice health; a manual GC frees orphaned blobs.
              If GC is healthy and the volume is still filling, the working set has
              genuinely grown — check per-project size before expanding again.
