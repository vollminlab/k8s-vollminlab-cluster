apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-values
  namespace: monitoring
  labels:
    app: promtail
    env: production
    category: observability
data:
  values.yaml: |
    config:
      clients:
        - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
      snippets:
        # Replaces the chart's default list, so cri must stay first.
        pipelineStages:
          - cri: {}
          # Trivy scan Jobs dump ~44k lines in ~6s (peak 10k lines/s), ~1,360 pods a day,
          # 13% of all Loki bytes over 14d. trivy-operator reads the reports through the
          # Kubernetes API, so the Loki copy is redundant, and it would trip the limit
          # below on every scan.
          - match:
              selector: '{namespace="trivy-system", pod=~"scan-vulnerabilityreport-.+"}'
              action: drop
              drop_counter_reason: trivy_scan_report
          # Every Velero backup logs one info line per item, tagged backup=velero/<name>:
          # ~50k lines for daily-full and daily-b2, most of them in the first seconds, which
          # overran the limit below every night (9,726 dropped at 04:00 on 2026-10-22).
          # Velero already uploads that exact log to the bucket, complete, for every backup
          # (`velero backup logs <name>`), so the Loki copy is redundant. Only info lines
          # are dropped; warnings and errors, and every line without a backup= field
          # (repo maintenance, which the VeleroRepoMaintenanceNotStarting Loki rule reads),
          # still reach Loki.
          - match:
              selector: '{namespace="velero", container="velero"} |= "level=info" |= " backup=velero/"'
              action: drop
              drop_counter_reason: velero_backup_item_log
          # Runaway guard, one token bucket per pod (lines/s, not bytes). Normal 1-minute
          # peak per pod over 14d: 711 lines/s (velero), 680 (longhorn-manager). A 1-minute
          # average hid velero's backup-start burst, handled by the drop above. The
          # 2026-10-15..17 longhorn-manager flood ran at ~4,900 lines/s for ~34h and put
          # ~15 GB of junk in the loki bucket, filling MinIO. Loki's own limits did not
          # stop it: 2.3 MB/s is under its 3 MB per-stream limit. Dropped lines are
          # counted and alerted on (PromtailRateLimitingPod).
          - limit:
              rate: 1000
              burst: 20000
              by_label_name: pod
              drop: true

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: dmz
        operator: Equal
        value: "true"
        effect: NoSchedule

    # 14d measured: p50 246Mi, p95 252Mi, peak 256Mi -- pinned at the old 256Mi limit on
    # all 9 nodes, i.e. the ceiling was truncating demand rather than measuring it. The
    # old 64Mi request under-declared steady state to the scheduler by ~4x across 9 pods.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

    # Nothing scraped promtail before 2026-10-20, so drops were invisible: promtail on
    # k8sworker04 had silently dropped 2,508 entries during Loki outages. Keep only the
    # delivery and drop counters; promtail's per-file series would churn with every pod.
    serviceMonitor:
      enabled: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'logentry_dropped_lines.*|promtail_dropped_(entries|bytes)_total|promtail_sent_(entries|bytes)_total|promtail_batch_retries_total'
          action: keep

    podLabels:
      app: promtail
      env: production
      category: observability
