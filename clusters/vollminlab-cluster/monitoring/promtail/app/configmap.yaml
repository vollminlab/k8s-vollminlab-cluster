apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-values
  namespace: monitoring
  labels:
    app: promtail
    env: production
    category: observability
data:
  values.yaml: |
    config:
      clients:
        - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: dmz
        operator: Equal
        value: "true"
        effect: NoSchedule

    # 14d measured: p50 246Mi, p95 252Mi, peak 256Mi -- pinned at the old 256Mi limit on
    # all 9 nodes, i.e. the ceiling was truncating demand rather than measuring it. The
    # old 64Mi request under-declared steady state to the scheduler by ~4x across 9 pods.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

    podLabels:
      app: promtail
      env: production
      category: observability
