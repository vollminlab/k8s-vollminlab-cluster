apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-aaaa-check
  namespace: monitoring
  labels:
    app: dns-aaaa-check
    env: production
    category: observability
---
# ClusterRole, not Role: Ingress hosts to check live across every namespace,
# not just monitoring. get/list on ingresses only -- this job is strictly
# read-only and never touches Pi-hole or any cluster object.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dns-aaaa-check
  labels:
    app: dns-aaaa-check
    env: production
    category: observability
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dns-aaaa-check
  labels:
    app: dns-aaaa-check
    env: production
    category: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dns-aaaa-check
subjects:
  - kind: ServiceAccount
    name: dns-aaaa-check
    namespace: monitoring
