apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karma
  namespace: monitoring
  labels:
    app: karma
    env: production
    category: observability
spec:
  interval: 10m
  releaseName: karma
  chartRef:
    kind: OCIRepository
    name: karma-repo
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: karma-values
      valuesKey: values.yaml
