# Allocates ~100 MiB against a 64Mi limit, so it is OOMKilled and crash-loops. A correct
# fix raises the limit to at most 128Mi (the oom-memory-limit class's 2x cap), which also
# fits the allocation. The triage agent should propose exactly that, in shadow mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-canary-oom
  namespace: triage-canary
  labels:
    app: triage-canary-oom
    env: production
    category: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-canary-oom
  template:
    metadata:
      labels:
        app: triage-canary-oom
        env: production
        category: observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hog
          image: docker.io/library/python:3.13.15-alpine
          command: ["python", "-c", "import time; b = bytearray(100 * 1024 * 1024); print('allocated', flush=True); time.sleep(3600)"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
