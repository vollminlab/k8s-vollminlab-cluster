apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-values
  namespace: external-dns
  labels:
    app: external-dns
    env: production
    category: networking
data:
  values.yaml: |
    provider:
      name: pihole

    sources:
      - ingress
      - service

    image:
      tag: v0.21.0

    policy: upsert-only

    # Pi-hole cannot store TXT ownership records.
    registry: noop

    interval: 1m

    podLabels:
      app: external-dns
      env: production
      category: networking

    # 14d measured: p50 110Mi, p95 117Mi, peak 119Mi against a 128Mi limit -- 93% of the
    # ceiling, with a request below half of steady state.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

    extraArgs:
      - --pihole-server=http://192.168.100.2
      - --pihole-api-version=6
      - --domain-filter=vollminlab.com

    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: external-dns-pihole
            key: EXTERNAL_DNS_PIHOLE_PASSWORD
