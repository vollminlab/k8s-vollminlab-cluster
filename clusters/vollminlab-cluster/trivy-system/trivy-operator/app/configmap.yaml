apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-values
  namespace: trivy-system
  labels:
    app: trivy-operator
    env: production
    category: security
data:
  values.yaml: |
    excludeNamespaces: "actions-runner-system,arc-controller"

    # Chart default is
    #   pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob,job
    # `job` is dropped. Velero's kopia maintenance creates a kopia-maintain Job
    # per BackupRepository and they accumulate: measured 2026-09-11 there were
    # 160 Jobs cluster-wide, 138 of them in velero, 134 kopia-maintain. Each is a
    # separate scan target needing its own VulnerabilityReport, and with
    # scanJobsConcurrentLimit=1 at ~35 s per scan that is 78 minutes of scanning
    # for the velero Jobs alone — while velero keeps adding more. Only 67 of the
    # 134 had a report, i.e. the queue never drains.
    #
    # That backlog is what produced 59 MB/s of writes on k8sworker04 (83% of ALL
    # cluster disk writes) for 26 h: each scan unpacks the vulnerability DB and
    # image layers into the scan pod's emptyDir on the node root disk.
    #
    # Coverage cost is one image. Job-scoped reports covered just 2 distinct
    # images, and only `kyverno/kyverno-cli:v1.19.0` was unreachable any other
    # way — from `kyverno-migrate-resources`, a bare one-off Job that completed
    # on 2026-08-21 and runs nowhere. A Job otherwise shares its owner's image,
    # and the owning CronJob is still scanned.
    #
    # `pod` is deliberately KEPT: 9 images are reachable only as Pods, including
    # kube-apiserver, etcd, kube-scheduler and kube-controller-manager (static
    # pods have no controller), the CNPG postgres images and the Longhorn
    # instance-managers. Dropping `pod` would blind us to the control plane.
    targetWorkloads: "pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob"

    operator:
      # The chart reads operator.sbomGenerationEnabled. `sbomReport.enabled` is
      # referenced by NO template in chart 0.36.0, so the intent to disable SBOM
      # generation never took effect: OPERATOR_SBOM_GENERATION_ENABLED was "true"
      # in the live ConfigMap and 633 SBOMReport CRs had accumulated. Fixing the
      # key honours the original intent and drops both the per-scan SBOM work and
      # those 633 objects out of etcd.
      sbomGenerationEnabled: false
      scanJobsConcurrentLimit: 1

      # ClientServer mode. In the default Standalone mode every scan pod
      # downloads the vulnerability DB (~128 MB compressed, several hundred MB
      # unpacked) into an emptyDir before scanning anything. On 2026-10-15 that
      # was 99-215 MB/s of writes from scan pods on k8sworker02 in the 20
      # minutes before the shared datastore stalled for ~50 s and faulted the
      # MinIO volume. With the built-in server the DB is downloaded once, by
      # the trivy-server StatefulSet, and scan jobs run as clients against it.
      builtInTrivyServer: true

      # Chart default 30s. A scan that fails deterministically retried forever:
      # prowlarr's report exceeded the API object size limit (2,641,054 vs
      # 2,097,152 bytes) and an unpullable minio image failed every time, each
      # one re-running a full scan every 10-30 minutes. 6h bounds a permanent
      # failure to 4 attempts a day while still retrying transient ones.
      scanJobsRetryDelay: 6h

      # NOTE ON SCAN-JOB TOLERATIONS — deliberately absent.
      # An `operator.scanJobTolerations` block lived here until 2026-09-11, with a
      # comment asserting `operator.` was the correct parent. It is not: chart
      # 0.36.0 reads `.Values.trivyOperator.scanJobTolerations`
      # (templates/configmaps/operator.yaml:12). The block was dead for its entire
      # life — the live operator ConfigMap carried no scan-job toleration key at
      # all, only `nodeCollector.tolerations`.
      #
      # Removed rather than re-parented, because the CP toleration it granted is
      # now unsafe: measured 2026-09-11 the control planes sit at 5.59/5.95/6.57
      # GB of 7.75 GB — 1.2 to 2.2 GB headroom — and a scan pod requests 256Mi
      # with a 1Gi limit. These are the same nodes with the apiserver-OOM refault
      # history.
      #
      # Scanning has been scheduling fine without it (352 VulnerabilityReports),
      # so nothing regresses. If FailedScheduling -> BackoffLimitExceeded returns,
      # the cause is CPU *requests* over-allocated ~5x against actual usage on the
      # general workers — fix that, rather than putting scan pods on a control
      # plane with 1.2 GB free.
    trivy:
      ignoreUnfixed: true

      # Chart default is UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL. LOW and UNKNOWN are
      # dropped as not actionable; MEDIUM stays, because MEDIUM is where most
      # patchable library findings sit.
      severity: MEDIUM,HIGH,CRITICAL

      # Ignore linux-libc-dev: it is the kernel *headers* package, and Trivy
      # matches every kernel CVE against it. A container runs on the node's
      # kernel, never the one those headers describe, so none of these findings
      # apply to the image. Measured 2026-10-15 on prowlarr (Ubuntu 24.04 base):
      # 4,217 of its 5,286 fixable findings were this one package, which made
      # the report too large to store (a VulnerabilityReport is ~760 B per
      # finding against a ~1.5 MiB object limit). With it ignored, prowlarr is
      # 906 findings at MEDIUM+. Kernel CVEs belong to the node OS, which is
      # patched by the node playbooks, not by image rebuilds.
      # The key prefix "ignorePolicy" makes this apply to every namespace.
      ignorePolicy: |
        package trivy

        import rego.v1

        default ignore := false

        ignore if input.PkgName == "linux-libc-dev"

      # Built-in server storage. An emptyDir, not a PVC: the cache is a
      # re-downloadable DB, and a default Longhorn PVC would write it three
      # times over to the same datastore this change is meant to relieve. A
      # server restart costs one DB download.
      storageClassEnabled: false
      labels:
        app: trivy-operator
        env: production
        category: security
      podLabels:
        app: trivy-operator
        env: production
        category: security
      # Use an in-memory analysis cache for scan jobs. Trivy >=0.66 added a
      # lock timeout on the filesystem (BoltDB) cache; pods whose containers
      # share an image (e.g. longhorn-driver-deployer's init + main container
      # both run longhorn-manager) launch concurrent scans against one shared
      # cache emptyDir and deadlock on the lock -> BackoffLimitExceeded. The
      # memory backend has no on-disk lock, so concurrent same-image scans
      # succeed. Requires trivy >=0.68.1 (chart 0.34.0 default is 0.72.0).
      configFile:
        cache:
          backend: memory
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

    nodeCollector:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: dmz
          operator: Equal
          value: "true"
          effect: NoSchedule

    serviceMonitor:
      enabled: true

    # The trivy-operator Deployment reads TOP-LEVEL `resources`. These lived
    # under `operator.resources` until 2026-08-19, which the chart does not
    # reference at all (same silent-drop as scanJobTolerations above), so the
    # operator ran completely unbounded — 1117Mi 30d peak, the largest
    # unbounded consumer in the cluster. The old dead values capped memory at
    # 768Mi, below that peak, so simply re-nesting them would have OOMKilled it.
    # No CPU limit: throttling a scan backlog buys nothing (see require-resources).
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
