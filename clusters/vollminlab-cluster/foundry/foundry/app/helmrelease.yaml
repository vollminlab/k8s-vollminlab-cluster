apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foundry
  namespace: foundry
  labels:
    app: foundry
    env: production
    category: gaming
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: foundryvtt
      version: "15.2.3"
      sourceRef:
        kind: HelmRepository
        name: foundry-repo
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: foundry-values
      valuesKey: values.yaml
