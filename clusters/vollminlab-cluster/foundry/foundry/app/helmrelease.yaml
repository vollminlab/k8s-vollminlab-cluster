apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foundry
  namespace: foundry
  labels:
    app: foundry
    env: production
    category: gaming
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: foundryvtt
      version: "15.2.3"
      sourceRef:
        kind: HelmRepository
        name: foundry-repo
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: foundry-values
      valuesKey: values.yaml
  # The chart only emits these three alongside its own Ingress, which is disabled
  # in configmap.yaml because this repo keeps Ingresses as standalone manifests.
  # Without them Foundry advertises http://<pod>:30000 and every invitation link
  # is unreachable. Pod-template env is mutable, so this patch is upgrade-safe.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: foundry
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: foundry
              spec:
                template:
                  spec:
                    containers:
                      - name: foundryvtt
                        env:
                          - name: FOUNDRY_HOSTNAME
                            value: foundry.vollminlab.com
                          - name: FOUNDRY_PROXY_SSL
                            value: "true"
                          - name: FOUNDRY_PROXY_PORT
                            value: "443"
