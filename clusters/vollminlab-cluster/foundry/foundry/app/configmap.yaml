apiVersion: v1
kind: ConfigMap
metadata:
  name: foundry-values
  namespace: foundry
  labels:
    app: foundry
    env: production
    category: gaming
data:
  values.yaml: |
    # nameOverride makes the chart's fullname helper resolve to a bare "foundry"
    # instead of "foundry-foundryvtt", and sets app.kubernetes.io/name=foundry
    # which the Homepage Kubernetes badge matches on.
    nameOverride: foundry

    image:
      registry: ghcr.io
      repository: felddy/foundryvtt
      pullPolicy: IfNotPresent

    config:
      # All three point at the single Secret materialized by the ExternalSecret.
      foundryAuthSecret:
        name: foundry-credentials
        usernameKey: username
        passwordKey: password
      adminKeySecret:
        name: foundry-credentials
        key: admin-key
      licenseKeySecret:
        name: foundry-credentials
        key: license-key
      # false = the container rewrites options.json from env on every start, so
      # the manifest stays the source of truth. Changing settings in Foundry's
      # admin UI will not survive a restart, which is intended.
      preserveConfig: false
      enableTelemetry: false
      minifyStaticFiles: true
      cssTheme: dark
      downloadRetries: 5

    # 10Gi is the chart default and deliberate: x3 Longhorn replicas = 30Gi
    # cluster-wide. 20Gi would drop worker03's schedulable headroom from
    # 27.3GiB to ~7.3GiB and constrain the next PVC anyone provisions. Foundry
    # itself needs ~1Gi; the rest is uploaded maps and audio. storage.md:
    # "Start conservative. Expand later." Longhorn resizes online, no downtime.
    storage:
      size: 10Gi
      className: longhorn

    service:
      type: ClusterIP
      port: 80

    # The chart CAN render an Ingress, but this repo keeps Ingresses as standalone
    # manifests (ingress.yaml) so they are greppable in git and are not re-submitted
    # to the API server by CI's HelmRelease dry-run. Disabling it here costs the
    # three FOUNDRY_* proxy env vars the chart only emits alongside its own Ingress,
    # so the HelmRelease re-injects them via postRenderers. See ingress.yaml.
    ingress:
      enabled: false

    # Kyverno require-resources: requests for cpu+memory and a memory limit are
    # mandatory. A CPU limit is deliberately omitted per .claude/rules/kyverno.md.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 4Gi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    podLabels:
      app: foundry
      env: production
      category: gaming

    podAnnotations:
      # Keep Velero's file-system backup away from the live LevelDB. Foundry's own
      # docs are explicit that copying its database files while the server runs can
      # corrupt them. The durable copy is the ReplicationSource added in this same
      # PR, which restics a frozen Longhorn clone instead of the live volume.
      #
      # This is the documented EXCEPTION to the `backup.vollminlab.com/volsync: "true"`
      # PVC-label contract in .claude/rules/velero.md. That contract's mechanism for a
      # chart-templated PVC is a postRenderers patch (harbor is the worked example),
      # but Foundry's PVC comes from the chart's StatefulSet volumeClaimTemplates,
      # which Kubernetes forbids updating after creation — verified 2026-08-22, a
      # server-side dry-run patch adding the label is rejected with "updates to
      # statefulset spec for fields other than 'replicas', 'ordinals', 'template',
      # 'updateStrategy', 'revisionHistoryLimit', 'persistentVolumeClaimRetentionPolicy'
      # and 'minReadySeconds' are forbidden". A postRenderer targeting that field would
      # make every future Helm upgrade of this release fail permanently.
      #
      # Note this HelmRelease does carry a postRenderer — it patches the pod template's
      # env, which IS mutable. The forbidden thing is volumeClaimTemplates specifically,
      # not postRenderers as such. So the label cannot be reached by any means here, and
      # the pod annotation achieves the same skip, is mutable, and stays in git.
      backup.velero.io/backup-volumes-excludes: data

    # ALL THREE PROBES ARE tcpSocket, NOT httpGet. Foundry mints a new client
    # session for EVERY HTTP request and never expires them, so the chart's
    # default `httpGet: /` probes leak sessions forever. Measured 2026-08-22:
    # 2,969 sessions in 4h06m -- ~17,000/day -- every one from kubelet, none
    # from a human. Foundry walks that table per request, so it degrades
    # continuously, and the log becomes unreadable (199 of 200 lines were probe
    # sessions, burying the one real event).
    #
    # `/api/status` does NOT help: measured, 3 requests produced 3 sessions.
    # ANY HTTP request mints one. A raw TCP connect produces ZERO (5 connects,
    # delta 0), because it never reaches the HTTP layer.
    #
    # Trade-off, accepted deliberately: a TCP probe cannot detect a hung Node
    # process that still accepts connections. For a single-replica app whose
    # process either runs or does not, that is a far better bargain than a
    # self-inflicted session leak -- the HTTP probes were themselves the
    # degradation they were supposed to detect.
    livenessProbe:
      initialDelaySeconds: 600
      failureThreshold: 10
      periodSeconds: 300
      # Helm DEEP-MERGES values maps, so the chart's default httpGet survives
      # unless explicitly nulled -- leaving a probe with two handlers, which the
      # API server rejects. Verified in the render before and after.
      httpGet: null
      tcpSocket:
        port: http
    readinessProbe:
      initialDelaySeconds: 30
      failureThreshold: 18
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
      httpGet: null
      tcpSocket:
        port: http
    # failureThreshold 60 x 10s = 10 minutes, because first boot downloads the
    # ~1GB Foundry distribution before the port opens. The chart default of 18
    # (3 minutes) is not enough.
    startupProbe:
      failureThreshold: 60
      periodSeconds: 10
      timeoutSeconds: 5
      httpGet: null
      tcpSocket:
        port: http
