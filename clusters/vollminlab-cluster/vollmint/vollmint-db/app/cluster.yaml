apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vollmint-db
  namespace: vollmint
  labels:
    app: vollmint-db
    env: production
    category: apps
spec:
  instances: 2
  # Sized from 14d measured usage (p95 173Mi, peak 259Mi, cpu p95 11m).
  # Without this block the instance pods are BestEffort -- the first QoS class the
  # kubelet evicts under node memory pressure, and the highest oom_score_adj for the
  # node OOM killer. Kyverno's require-resources never flagged it because that policy
  # matches Deployment/StatefulSet/DaemonSet and CNPG creates bare Pods.
  # Request sits above p95 so the scheduler reserves what is actually used; the limit
  # carries the headroom. No CPU limit, per this cluster's policy.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  inheritedMetadata:
    labels:
      app: vollmint-db
      env: production
      category: apps
  storage:
    size: 5Gi
    storageClass: longhorn
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: vollmint
      owner: vollmint
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/vollmint-db
      endpointURL: http://minio.minio.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "14d"
