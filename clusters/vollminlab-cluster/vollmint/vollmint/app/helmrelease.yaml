apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vollmint
  namespace: vollmint
  labels:
    app: vollmint
    env: production
    category: apps
spec:
  interval: 10m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: vollmint-repo
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: vollmint-values
