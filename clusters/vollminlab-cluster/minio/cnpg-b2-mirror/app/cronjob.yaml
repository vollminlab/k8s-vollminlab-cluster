apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-b2-mirror
  namespace: minio
  labels:
    app: cnpg-b2-mirror
    env: production
    category: storage
spec:
  # 09:00 UTC. After the CNPG ScheduledBackups (all six run 20:00-21:15 UTC,
  # measured 2026-10-15) so the previous evening's base backups are included,
  # and clear of every other window: VolSync 00:00-02:00, velero daily-full
  # 03:00, daily-b2 04:00, grafana-b2 05:00, monthly-b2 06:00, vmbackup 07:30
  # with a 2h ceiling.
  schedule: "0 9 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      # The first run uploads the whole bucket (8.4 GB measured 2026-08-22).
      # Every run after that copies only objects B2 does not already have, so
      # the steady state is one day of base backups plus that day's WAL.
      activeDeadlineSeconds: 5400
      # backoffLimit 0 would make a single transient B2 error a failed day.
      # Raised 1 -> 3 on 2026-08-25. One retry was not enough: a failed run
      # leaves the day's WAL unmirrored, so the next run has MORE to copy and
      # is MORE likely to hit another transient error — the backlog and the
      # failure probability feed each other. Observed 2026-08-23 -> 08-25:
      # last success 08-23, and by 08-25 a run was moving 1.08 GiB and dying
      # partway. Each attempt is incremental and keeps what it copied, so extra
      # attempts strictly converge.
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: cnpg-b2-mirror
            env: production
            category: storage
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              # rclone, not mc. MinIO withdrew mc from Docker Hub (2026-09-16),
              # then from quay.io, and dl.min.io now answers 410 Gone for the
              # binaries too: on 2026-10-15 the pull failed with `unauthorized`
              # and the Job sat in ImagePullBackOff until activeDeadlineSeconds.
              # It ran at all until then only because nodes had the old image
              # cached. rclone is an independent, maintained project that speaks
              # S3 to MinIO and B2's native API, so neither end's vendor can
              # strand this job again. Pinned by digest as well as tag.
              image: docker.io/rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                # Both remotes are defined entirely by RCLONE_CONFIG_<NAME>_*
                # variables, so no config file is written and no credential
                # ever appears on a command line or passes through the shell.
                #
                # Source: the existing cnpg-svc principal, whose MinIO policy
                # (cnpg-policy, in minio/app/configmap.yaml) is already scoped to
                # the cnpg-backups bucket and nothing else. This job only ever
                # reads through it, so a dedicated read-only principal would add
                # a second 1Password item and a MinIO Helm post-job run against
                # the backup store for no reduction in blast radius.
                #
                # The access key is not a secret: it is declared in plain text as
                # `accessKey: cnpg-svc` in the MinIO chart values. Only the secret
                # key comes from 1Password, via the cnpg-minio-user ExternalSecret
                # this namespace already has for the Helm post-job.
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: s3
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: Minio
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  value: http://minio.minio.svc.cluster.local:9000
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  value: cnpg-svc
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-minio-user
                      key: secretKey
                # Destination: B2's native API, not its S3 endpoint. The S3
                # endpoint rejects headers that newer AWS SDKs send by default
                # (x-amz-tagging, and the checksum headers; see velero.md), and
                # the native backend has none of that surface. A B2 application
                # key is the same credential under either API: key ID = account.
                - name: RCLONE_CONFIG_B2_TYPE
                  value: b2
                - name: RCLONE_CONFIG_B2_ACCOUNT
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-b2-credentials
                      key: B2_ACCESS_KEY
                - name: RCLONE_CONFIG_B2_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-b2-credentials
                      key: B2_SECRET_KEY
                # readOnlyRootFilesystem: point everything rclone might write
                # at the /tmp emptyDir. The config path need not exist.
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
                - name: RCLONE_CACHE_DIR
                  value: /tmp/cache
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # Prove both endpoints answer before copying. Without this a
                  # credential or endpoint fault could surface as "nothing to
                  # copy" and exit 0, which is indistinguishable from "already
                  # up to date" and is exactly how a backup reports success while
                  # protecting nothing.
                  rclone lsf --max-depth 1 src:cnpg-backups > /dev/null
                  rclone lsf --max-depth 1 b2:vollminlab-k8s-cnpg > /dev/null

                  # copy, not sync: nothing is ever deleted from B2, so the
                  # offsite copy reaches back past MinIO's 7d (authentik) / 14d
                  # (the rest) retention. Bound it with a B2 lifecycle rule.
                  #
                  # --size-only: barman-cloud writes every object exactly once
                  # under a unique name (WAL segment, base backup id), so name +
                  # size is a complete identity. It also keeps the first run from
                  # re-uploading the ~20k objects mc wrote: they carry no rclone
                  # mtime, and MinIO (MD5) and B2 (SHA-1) share no hash. mc's own
                  # mirror only checked existence, so this is strictly stronger.
                  #
                  # Memory: each transfer buffers up to chunk-size x
                  # upload-concurrency for large files. 4 x 2 x 32M = 256M,
                  # inside the 512Mi limit. rclone's defaults (96M x 4 per file)
                  # would need ~1.5Gi.
                  #
                  # Retries: rclone retries failed objects (--low-level-retries)
                  # and then the whole pass (--retries) and exits non-zero if any
                  # object still failed. It never exits 0 with objects missing.
                  rclone copy src:cnpg-backups b2:vollminlab-k8s-cnpg \
                      --size-only \
                      --transfers 4 \
                      --b2-chunk-size 32M \
                      --b2-upload-cutoff 32M \
                      --b2-upload-concurrency 2 \
                      --retries 3 \
                      --stats 1m --stats-one-line --stats-log-level NOTICE

                  # Content guard. A copy into an empty destination that copied
                  # nothing still exits 0.
                  n="$(rclone lsf -R --files-only b2:vollminlab-k8s-cnpg | wc -l)"
                  echo "objects in B2 after copy: $n"
                  if [ "$n" -le 0 ]; then
                    echo "ERROR: destination is empty after a successful copy" >&2
                    exit 1
                  fi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            # readOnlyRootFilesystem is on. rclone's config path, cache dir
            # and HOME all point under /tmp, so one emptyDir covers them. Skipped by Velero FSB globally via
            # the volumeTypes: [emptyDir] rule in velero-skip-smb-policy.
            - name: tmp
              emptyDir: {}
