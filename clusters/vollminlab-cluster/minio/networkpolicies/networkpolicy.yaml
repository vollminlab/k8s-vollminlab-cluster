---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow ingress-nginx to reach MinIO console UI (9001)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
---
# Allow CNPG backup traffic from all namespaces with managed clusters
# (authentik-db, harbor-db, jellystat-db in mediastack, shlink-db in shlink)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-backups
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shlink
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mediastack
      ports:
        - protocol: TCP
          port: 9000
---
# Allow Velero backups and Loki log storage
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-velero-loki
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velero
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9000
---
# Allow Tofu Terraform state backend access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tofu-state
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tofu
      ports:
        - protocol: TCP
          port: 9000
---
# Allow Prometheus scraping from monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Allow egress to Kubernetes API server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api-egress
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 6443
---
# Allow external HTTPS egress (MinIO OIDC validation against authentik.vollminlab.com)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow the Helm post-upgrade hook Job (minio-post-job) to reach the MinIO API on
# 9000 to create buckets/users/policies. The ephemeral hook pod carries app=minio-job,
# which no cross-namespace allow rule covers, and default-deny-all blocks intra-namespace
# pod-to-pod in both directions. Without this the hook's mc client times out dialing
# minio:9000 and the HelmRelease upgrade is marked failed even though MinIO is healthy
# (surfaced on the first upgrade after PR #970, the first in ~2 months).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-post-job-egress
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector:
    matchLabels:
      app: minio-job
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
---
# Companion ingress: MinIO must accept the hook pod's connection on the API port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-post-job-ingress
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: minio-job
      ports:
        - protocol: TCP
          port: 9000
