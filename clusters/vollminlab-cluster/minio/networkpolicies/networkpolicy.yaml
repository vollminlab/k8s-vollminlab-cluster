---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow ingress-nginx to reach MinIO console UI (9001)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
---
# Allow CNPG backup traffic from all namespaces with managed clusters.
# Keep this list in sync with every CNPG Cluster in the repo -- the far side
# (the app namespace's own egress rule) is not enough on its own, and a missing
# entry here fails silently: the Cluster still reports "healthy", only
# .status.conditions ContinuousArchiving flips to False.
# Current CNPG clusters: authentik-db, harbor-db, shlink-db,
# jellystat-db (mediastack), vollmint-db (vollmint).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-backups
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shlink
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mediastack
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vollmint
      ports:
        - protocol: TCP
          port: 9000
---
# Allow Velero backups and Loki log storage
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-velero-loki
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velero
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9000
---
# Allow Tofu Terraform state backend access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tofu-state
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tofu
      ports:
        - protocol: TCP
          port: 9000
---
# Allow Prometheus scraping from monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Allow egress to Kubernetes API server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api-egress
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 6443
---
# Allow external HTTPS egress (MinIO OIDC validation against authentik.vollminlab.com)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow the Helm post-upgrade hook Job (minio-post-job) to reach the MinIO API on
# 9000 to create buckets/users/policies. The ephemeral hook pod carries app=minio-job,
# which no cross-namespace allow rule covers, and default-deny-all blocks intra-namespace
# pod-to-pod in both directions. Without this the hook's mc client times out dialing
# minio:9000 and the HelmRelease upgrade is marked failed even though MinIO is healthy
# (surfaced on the first upgrade after PR #970, the first in ~2 months).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-post-job-egress
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector:
    matchLabels:
      app: minio-job
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
---
# Companion ingress: MinIO must accept the hook pod's connection on the API port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-post-job-ingress
  namespace: minio
  labels:
    app: minio
    env: production
    category: security
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: minio-job
      ports:
        - protocol: TCP
          port: 9000
---
# The cnpg-b2-mirror CronJob reads the cnpg-backups bucket and copies it to
# Backblaze B2. Two hops, and only one of them needs a rule here:
#
#   * MinIO on 9000 — intra-namespace, needs these two policies. Verified
#     container port: svc minio 9000 -> targetPort 9000 -> containerPort 9000
#     (named `http`), so 9000 is correct on both sides of the DNAT.
#   * Backblaze B2 on 443 — already granted by allow-https-egress, whose
#     podSelector is {} and therefore covers every pod in this namespace.
#     DNS likewise comes from allow-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-b2-mirror-egress
  namespace: minio
  labels:
    app: cnpg-b2-mirror
    env: production
    category: storage
spec:
  podSelector:
    matchLabels:
      app: cnpg-b2-mirror
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-b2-mirror-ingress
  namespace: minio
  labels:
    app: cnpg-b2-mirror
    env: production
    category: storage
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cnpg-b2-mirror
      ports:
        - protocol: TCP
          port: 9000
