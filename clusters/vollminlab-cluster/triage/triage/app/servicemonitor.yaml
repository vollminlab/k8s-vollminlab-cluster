apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: triage-dispatcher
  namespace: triage
  labels:
    app: triage-dispatcher
    env: production
    category: observability
spec:
  selector:
    matchLabels:
      app: triage-dispatcher
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
