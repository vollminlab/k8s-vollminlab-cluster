apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: triage-pushover
  namespace: triage
  labels:
    app: triage
    env: production
    category: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword-cluster-store
    kind: ClusterSecretStore
  target:
    name: triage-pushover
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: "Triage Pushover"
        property: token
    - secretKey: user-key
      remoteRef:
        key: "Triage Pushover"
        property: user-key
