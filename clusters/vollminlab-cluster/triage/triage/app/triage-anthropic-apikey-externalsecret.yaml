apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: triage-anthropic-apikey
  namespace: triage
  labels:
    app: triage
    env: production
    category: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-cluster-store
    kind: ClusterSecretStore
  target:
    name: triage-anthropic-apikey
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: "Triage Anthropic API Key"
        property: api_key
