apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: triage-github-app
  namespace: triage
  labels:
    app: triage
    env: production
    category: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-cluster-store
    kind: ClusterSecretStore
  target:
    name: triage-github-app
    creationPolicy: Owner
  data:
    - secretKey: app_id
      remoteRef:
        key: "Triage GitHub App"
        property: github_app_id
    - secretKey: installation_id
      remoteRef:
        key: "Triage GitHub App"
        property: github_app_installation_id
    - secretKey: private_key
      remoteRef:
        key: "Triage GitHub App"
        property: password
