apiVersion: v1
kind: Service
metadata:
  name: triage-dispatcher
  namespace: triage
  labels:
    app: triage-dispatcher
    env: production
    category: observability
spec:
  # Explicit: restrict-loadbalancer-services' pattern requires the field, and CI
  # validates the file before the API server would default it.
  type: ClusterIP
  selector:
    app: triage-dispatcher
  ports:
    - name: http
      port: 8080
      targetPort: http
