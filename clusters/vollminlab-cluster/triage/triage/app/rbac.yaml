apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-dispatcher
  namespace: triage
  labels:
    app: triage-dispatcher
    env: production
    category: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-agent
  namespace: triage
  labels:
    app: triage-agent
    env: production
    category: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-sweep
  namespace: triage
  labels:
    app: triage-sweep
    env: production
    category: observability
automountServiceAccountToken: false
---
# The dispatcher's queue: Jobs in its own namespace, and their pods' termination
# messages (publish's outcome and spend).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: triage-dispatcher
  namespace: triage
  labels:
    app: triage-dispatcher
    env: production
    category: observability
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: triage-dispatcher
  namespace: triage
  labels:
    app: triage-dispatcher
    env: production
    category: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: triage-dispatcher
subjects:
  - kind: ServiceAccount
    name: triage-dispatcher
    namespace: triage
---
# Owner resolution only: Pod -> ReplicaSet -> Deployment, Pod -> Job -> CronJob.
# When the Pod/ReplicaSet/Job is already gone, owners.py infers the controller from
# the generated name and CONFIRMS it with a get on the Deployment, StatefulSet,
# DaemonSet or CronJob. Those reads are required: a 403 on the confirm re-raises,
# the dispatcher falls back to keying the incident on the Pod, and a resolve that
# arrives after the pod was replaced no longer matches the open issue.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: triage-dispatcher-owners
  labels:
    app: triage-dispatcher
    env: production
    category: observability
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triage-dispatcher-owners
  labels:
    app: triage-dispatcher
    env: production
    category: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: triage-dispatcher-owners
subjects:
  - kind: ServiceAccount
    name: triage-dispatcher
    namespace: triage
---
# The agent reads everything EXCEPT Secrets. RBAC has no deny, so the core group is
# an explicit list (a "*" there would include secrets). Every other group listed
# here contains no Secret-like kind. Helm stores releases as Secrets, which is why
# the agent cannot run helm at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: triage-agent-read
  labels:
    app: triage-agent
    env: production
    category: observability
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps", "nodes",
                "namespaces", "persistentvolumeclaims", "persistentvolumes", "serviceaccounts",
                "resourcequotas", "limitranges", "replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps", "batch", "autoscaling", "policy", "networking.k8s.io", "storage.k8s.io",
                "discovery.k8s.io", "events.k8s.io", "apiextensions.k8s.io",
                "helm.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io", "source.toolkit.fluxcd.io",
                "notification.toolkit.fluxcd.io", "infra.contrib.fluxcd.io",
                "longhorn.io", "velero.io", "volsync.backube", "postgresql.cnpg.io",
                "kyverno.io", "wgpolicyk8s.io", "reports.kyverno.io", "monitoring.coreos.com",
                "external-secrets.io", "cert-manager.io", "metallb.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triage-agent-read
  labels:
    app: triage-agent
    env: production
    category: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: triage-agent-read
subjects:
  - kind: ServiceAccount
    name: triage-agent
    namespace: triage
