apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slate-builder-apikey
  namespace: slate-builder
  labels:
    app: slate-builder
    env: production
    category: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-cluster-store
    kind: ClusterSecretStore
  target:
    name: slate-builder-apikey
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: "Slate Builder API Key"
        property: credential
