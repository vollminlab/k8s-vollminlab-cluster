apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slate-builder
  namespace: slate-builder
  labels:
    app: slate-builder
    env: production
    category: apps
spec:
  interval: 10m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: slate-builder-repo
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: slate-builder-values
