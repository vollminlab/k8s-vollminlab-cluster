apiVersion: apps/v1
kind: Deployment
metadata:
  name: rreading-glasses
  namespace: mediastack
  labels:
    app: rreading-glasses
    env: production
    category: media
    app.kubernetes.io/name: rreading-glasses
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO PVC — see .claude/rules/storage.md
  selector:
    matchLabels:
      app: rreading-glasses
  template:
    metadata:
      labels:
        app: rreading-glasses
        env: production
        category: media
        app.kubernetes.io/name: rreading-glasses
      annotations:
        # Cache only; a FSB copy of a live Postgres data dir is torn and useless.
        backup.velero.io/backup-volumes-excludes: "pgdata"
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rreading-glasses
          image: docker.io/blampe/rreading-glasses:hardcover@sha256:3f017a51d9007b715303a20f481c822e4df66485fc9e5f57f6fdf1de840dc02f
          command: ["/main", "serve"]
          env:
            - name: POSTGRES_HOST
              value: "127.0.0.1"
            - name: POSTGRES_DATABASE
              value: rreading-glasses
          envFrom:
            - secretRef:
                name: rreading-glasses-hardcover
          ports:
            - name: http
              containerPort: 8788
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              # Go GOMEMLIMIT is derived as 85% of this; the in-memory cache grows to fill it.
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: postgres
          image: docker.io/library/postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
          args: ["-c", "listen_addresses=127.0.0.1"]
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_DB
              value: rreading-glasses
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: pgrun
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pvc-rreading-glasses-cache
        - name: pgrun
          emptyDir: {}
