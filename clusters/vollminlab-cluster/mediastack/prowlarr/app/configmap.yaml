apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-values
  namespace: mediastack
  labels:
    app: prowlarr
    env: production
    category: media
data:
  values.yaml: |
    persistence:
      config:
        enabled: true
        existingClaim: pvc-prowlarr-config
        mountPath: /config
    podLabels:
      app: prowlarr
      env: production
      category: media
    # Velero FSB: exclude ephemeral scratch emptyDirs. MUST live under
    # workload.main.podSpec.annotations — the TrueCharts common chart ignores a
    # top-level podAnnotations key, so the annotation never reached the pod. The
    # `shared` volume in particular hangs the kopia data-mover (PartiallyFailed
    # backups + orphaned pods); the rest are pure scratch not worth backing up.
    workload:
      main:
        podSpec:
          containers:
            # The exportarr sidecar comes from the chart, and its 256Mi/512Mi-1Gi
            # defaults were never ours. Measured 2026-08-19 over 14d, every exportarr
            # instance in the cluster peaks between 14Mi and 49Mi. Normalised to
            # 64Mi/256Mi across all six -- the four chart sidecars and the two
            # standalone Deployments (bazarr, sabnzbd) -- which previously spanned
            # 32Mi-256Mi requests and 64Mi-1Gi limits for one identical binary.
            exportarr:
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          annotations:
            backup.velero.io/backup-volumes-excludes: "tmp,varlogs,varrun,devshm,shared"
    env:
      PROWLARR__AUTH__METHOD: "External"
    terminationGracePeriodSeconds: 60
    lifecycle:
      preStop:
        exec:
          command: ["/bin/sh", "-c", "sleep 10"]
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - velero
              topologyKey: kubernetes.io/hostname
    resources:
      requests:
        # VPA target ~11m but upperBound ~64m (bursty indexer syncs). Request
        # 100m→75m keeps the floor above the observed peak. Limit unchanged (500m).
        cpu: 75m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
