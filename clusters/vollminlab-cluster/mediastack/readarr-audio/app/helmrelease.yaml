apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: readarr-audio
  namespace: mediastack
  labels:
    app: readarr-audio
    env: production
    category: media
spec:
  interval: 5m
  # Same chart source as readarr: one OCIRepository, two releases.
  chartRef:
    kind: OCIRepository
    name: readarr-repo
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: readarr-audio-values
      valuesKey: values.yaml
