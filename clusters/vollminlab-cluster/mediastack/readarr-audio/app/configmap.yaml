apiVersion: v1
kind: ConfigMap
metadata:
  name: readarr-audio-values
  namespace: mediastack
  labels:
    app: readarr-audio
    env: production
    category: media
data:
  values.yaml: |
    persistence:
      # Audiobooks-only instance. Deliberately NO /books mount: the ebook
      # instance (readarr) owns /books, and each Readarr tracks one file per book,
      # so the same title can exist once as an ebook there and once as audio here.
      config:
        enabled: true
        existingClaim: pvc-readarr-audio-config
        mountPath: /config
      downloads:
        enabled: true
        existingClaim: pvc-completed-downloads
        mountPath: /downloads
      audiobooks:
        enabled: true
        existingClaim: pvc-audiobooks
        mountPath: /audiobooks
    terminationGracePeriodSeconds: 60
    lifecycle:
      preStop:
        exec:
          command: ["/bin/sh", "-c", "sleep 10"]
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - velero
              topologyKey: kubernetes.io/hostname
    resources:
      requests:
        # Starting point copied from readarr (VPA target ~35m there); re-measure.
        cpu: 50m
        memory: 256Mi
      limits:
        # Explicit null, not omission. This chart merges values with
        # common.resources = {limits: {cpu: 4000m, memory: 8Gi}}, so simply
        # dropping the key inherits 4000m rather than removing the limit.
        cpu: null
        memory: 512Mi
    image:
      repository: ghcr.io/pennydreadful/bookshelf
      tag: hardcover-v0.4.20.129@sha256:388eecc94362580eae31ee0a454be6af516f8a311f8432a521c202fb475f4359
    workload:
      main:
        podSpec:
          # Pod labels MUST live here, for the same reason as the annotations: the
          # common chart ignores a top-level podLabels key. Without this the chart
          # sets app=<chart>-<version> and no category, and a stale category written
          # by an old Kyverno mutation (security) was never corrected.
          labels:
            app: readarr-audio
            env: production
            category: media
          # Velero FSB: exclude ephemeral scratch emptyDirs. MUST live under
          # workload.main.podSpec.annotations — the TrueCharts common chart ignores
          # a top-level podAnnotations key, so the annotation never reached the pod.
          # The `shared` volume in particular hangs the kopia data-mover
          # (PartiallyFailed backups + orphaned pods); the rest are pure scratch.
          annotations:
            backup.velero.io/backup-volumes-excludes: "tmp,varlogs,varrun,devshm,shared"
          containers:
            main:
              env:
                LSIO_NON_ROOT_USER: "true"
                # Same self-hosted metadata server (and Hardcover key, and cache) as
                # the ebook instance. A fresh DB has no saved metadataSource, so this
                # env value is the one in effect.
                METADATA_URL: "http://rreading-glasses.mediastack.svc.cluster.local"
                # Pre-set so tofu (readarr-audio-config) and Prowlarr can authenticate
                # from the first boot. 1P "Readarr Audio API Key".
                # Authentik forward-auth (bound to authentik Admins) is the login, so
                # Readarr's own is External rather than a second password. A fresh
                # config.xml says None, which makes Readarr 0.4 force a setup dialog.
                READARR__AUTH__METHOD: External
                READARR__AUTH__APIKEY:
                  secretKeyRef:
                    expandObjectName: false
                    name: readarr-audio-apikey
                    key: api_key
            # The exportarr sidecar comes from the chart, and its 512Mi default limit
            # was never ours. Measured 2026-08-19 over 14d, every exportarr instance in
            # the cluster peaks between 14Mi and 49Mi. Normalised to 64Mi/256Mi across
            # all six. Merged into this existing containers: block deliberately -- a
            # second containers: key at the same level is a duplicate YAML key, and the
            # later one silently wins, which is how the first attempt at this dropped
            # the override without any error.
            exportarr:
              # The API key comes from READARR__AUTH__APIKEY, so Readarr never writes
              # it to config.xml -- which is where exportarr looks by default. Without
              # this it exits "ApiKey is required to not be empty", the pod sits at 1/2,
              # and the Service has no endpoints (tofu/Prowlarr/Homepage all fail).
              env:
                API_KEY:
                  secretKeyRef:
                    expandObjectName: false
                    name: readarr-audio-apikey
                    key: api_key
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
    podSecurityContext:
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"
