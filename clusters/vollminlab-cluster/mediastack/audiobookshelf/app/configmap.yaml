apiVersion: v1
kind: ConfigMap
metadata:
  name: audiobookshelf-values
  namespace: mediastack
  labels:
    app: audiobookshelf
    env: production
    category: media
data:
  values.yaml: |
    persistence:
      config:
        enabled: true
        existingClaim: pvc-audiobookshelf-config
        mountPath: /config
      audiobooks:
        enabled: true
        existingClaim: pvc-audiobooks
        mountPath: /audiobooks
      books:
        enabled: true
        existingClaim: pvc-books
        mountPath: /books
      metadata:
        enabled: true
        existingClaim: pvc-audiobookshelf-metadata
        mountPath: /metadata
    securityContext:
      container:
        runAsUser: 0
        runAsGroup: 0
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - velero
              topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 750Mi
    podLabels:
      app: audiobookshelf
      env: production
      category: media
    # Velero FSB: exclude ephemeral scratch emptyDirs. MUST live under
    # workload.main.podSpec.annotations — the TrueCharts common chart ignores a
    # top-level podAnnotations key, so the annotation never reached the pod. The
    # `shared` volume in particular hangs the kopia data-mover (PartiallyFailed
    # backups + orphaned pods); the rest are pure scratch not worth backing up.
    workload:
      main:
        podSpec:
          annotations:
            backup.velero.io/backup-volumes-excludes: "tmp,varlogs,varrun,devshm,shared"
