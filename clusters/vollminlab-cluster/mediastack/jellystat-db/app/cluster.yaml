apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: jellystat-db
  namespace: mediastack
  labels:
    app: jellystat-db
    env: production
    category: media
spec:
  instances: 1
  # Sized from 14d measured usage (p95 229Mi, peak 353Mi, cpu p95 13m).
  # Without this block the instance pods are BestEffort -- the first QoS class the
  # kubelet evicts under node memory pressure, and the highest oom_score_adj for the
  # node OOM killer. Kyverno's require-resources never flagged it because that policy
  # matches Deployment/StatefulSet/DaemonSet and CNPG creates bare Pods.
  # Request sits above p95 so the scheduler reserves what is actually used; the limit
  # carries the headroom. No CPU limit, per this cluster's policy.
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      memory: 768Mi
  inheritedMetadata:
    labels:
      app: jellystat-db
      env: production
      category: media
  storage:
    size: 5Gi
    storageClass: longhorn
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: jfstat
      owner: jellystat
      secret:
        name: jellystat-db-credentials
      postInitSQL:
        - GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO jellystat
        - GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO jellystat
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO jellystat
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO jellystat
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/jellystat-db"
      endpointURL: "http://minio.minio.svc.cluster.local:9000"
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "14d"
