apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: mediastack
  labels:
    app: qbittorrent
    env: production
    category: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
        env: production
        category: media
    spec:
      securityContext:
        fsGroup: 568
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: fix-lockfile
          image: docker.io/library/busybox:1.38.0
          command: ["sh", "-c", "rm -f /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pvc-qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: pvc-completed-downloads
      containers:
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:5.2.0@sha256:4e665d7a597acf308aa01d84d7a378abd285982cd793785042c2f4110280b620
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: LSIO_NON_ROOT_USER
              value: "true"
            - name: WEBUI_PORT
              value: "8080"
          resources:
            requests:
              # VPA target/upperBound ~11m. Request 100m→50m. Limit unchanged (1000m).
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          ports:
            - containerPort: 8080
              name: webui
          readinessProbe:
            httpGet:
              path: /api/v2/app/version
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          securityContext:
            capabilities:
              add: [NET_ADMIN]
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: VPN_TYPE
              value: "openvpn"
            - name: SERVER_REGIONS
              value: "CA Montreal"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            # DoT upstream in gluetun v3.41.x leaks UDP sockets when queries time out
            # during VPN degradation (upstream #3351/#3377) — DoH is the endorsed workaround
            # (#956). A slower residual anon-memory leak remains on the DoH path; v3.41.3
            # pulls in the post-v3.41.1 DNS-engine / DoT-pool fixes to reduce it. The 512Mi
            # limit stays as the circuit-breaker (OOM-restart) if any leak persists.
            - name: DNS_UPSTREAM_RESOLVER_TYPE
              value: "doh"
          envFrom:
            - secretRef:
                name: qbittorrent-pia-credentials
          ports:
            - containerPort: 8000
              name: gluetun-ctrl
        - name: port-sync
          # Keeps qBittorrent's listen_port in sync with gluetun's PIA-forwarded port.
          # gluetun's firewall only allows inbound traffic on the forwarded port, but
          # qBittorrent doesn't know what that port is — without this, qBittorrent listens
          # on a port the tunnel firewall blocks and can't accept any inbound peers.
          image: docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          command:
            - sh
            - -c
            - |
              while true; do
                gluetun_port=$(curl -s -4 http://127.0.0.1:8000/v1/portforward | grep -o '"port":[0-9]*' | cut -d: -f2)
                if [ -n "$gluetun_port" ]; then
                  current_port=$(curl -s -4 http://127.0.0.1:8080/api/v2/app/preferences | grep -o '"listen_port":[0-9]*' | cut -d: -f2)
                  if [ -n "$current_port" ] && [ "$gluetun_port" != "$current_port" ]; then
                    curl -s -4 -X POST http://127.0.0.1:8080/api/v2/app/setPreferences \
                      --data-urlencode "json={\"listen_port\":$gluetun_port}"
                    echo "listen_port: $current_port -> $gluetun_port"
                  fi
                fi
                sleep 30
              done
          resources:
            requests:
              # Two curl forks per 30s loop are bursty enough to hit CFS throttling
              # at 50m even though average usage is ~1m (CPUThrottlingHigh fired
              # at ~40-45% of periods). Limit raised to give burst headroom.
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 150m
              memory: 32Mi
