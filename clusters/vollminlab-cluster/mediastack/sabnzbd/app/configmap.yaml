apiVersion: v1
kind: ConfigMap
metadata:
  name: sabnzbd-values
  namespace: mediastack
  labels:
    app: sabnzbd
    env: production
    category: media
data:
  values.yaml: |
    persistence:
      config:
        enabled: true
        existingClaim: pvc-sabnzbd-config
        mountPath: /config
      downloads:
        enabled: true
        existingClaim: pvc-completed-downloads
        mountPath: /downloads
      incomplete:
        enabled: true
        existingClaim: pvc-incomplete-downloads
        mountPath: /incomplete
    podLabels:
      app: sabnzbd
      env: production
      category: media
    # Velero FSB: exclude ephemeral scratch emptyDirs. MUST live under
    # workload.main.podSpec.annotations — the TrueCharts common chart ignores a
    # top-level podAnnotations key, so the annotation never reached the pod. The
    # `shared` volume in particular hangs the kopia data-mover (PartiallyFailed
    # backups + orphaned pods); the rest are pure scratch not worth backing up.
    workload:
      main:
        podSpec:
          annotations:
            backup.velero.io/backup-volumes-excludes: "tmp,varlogs,varrun,devshm,shared"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - velero
              topologyKey: kubernetes.io/hostname
    resources:
      requests:
        # VPA target ~15m; keep a 100m floor for par2/unrar CPU bursts on download
        # completion. Request 200m→100m. Limit unchanged (500m).
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    env:
      - name: SABNZBD__HOST_WHITELIST_ENTRIES
        value: sabnzbd.vollminlab.com,localhost,127.0.0.1
      - name: SABNZBD__USERNAME
        value: ""
      - name: SABNZBD__PASSWORD
        value: ""