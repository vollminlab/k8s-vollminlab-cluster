apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: readarr-audio-config-restic
  namespace: mediastack
spec:
  sourcePVC: pvc-readarr-audio-config
  trigger:
    schedule: "50 1 1-31/2 * *"
  restic:
    pruneIntervalDays: 7
    repository: volsync-readarr-audio-config-restic
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    copyMethod: Clone
    storageClassName: longhorn-r1
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn
    moverSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
