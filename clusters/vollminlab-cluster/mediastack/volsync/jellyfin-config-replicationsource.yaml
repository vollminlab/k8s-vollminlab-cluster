apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: jellyfin-config-restic
  namespace: mediastack
spec:
  sourcePVC: pvc-jellyfin-config
  trigger:
    schedule: "20 2 1-31/2 * *"
  restic:
    pruneIntervalDays: 7
    repository: volsync-jellyfin-config-restic
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    copyMethod: Clone
    storageClassName: longhorn-r1
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn
