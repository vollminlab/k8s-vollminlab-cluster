apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: bazarr-config-restic
  namespace: mediastack
spec:
  sourcePVC: pvc-bazarr-config
  trigger:
    schedule: "20 0 1-31/2 * *"
  restic:
    pruneIntervalDays: 7
    repository: volsync-bazarr-config-restic
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    copyMethod: Clone
    storageClassName: longhorn-r1
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn
    # Bazarr runs as uid/gid 568, and restic must read every file on the clone as
    # that user. Without this the mover pod gets an empty securityContext, runs as
    # the image's default user, and cannot open bazarr's 0600 `cache/` entries.
    # restic still *saves* the snapshot, then exits non-zero on "at least one
    # source file could not be read" — so VolSync retries forever, re-cloning the
    # volume every ~2 minutes. That loop ran 17h on 2026-09-11 and left bazarr
    # with no successful backup for 2.7 days, reported only as SyncInProgress.
    # The other arr sources here already carry this, for the same reason.
    moverSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
