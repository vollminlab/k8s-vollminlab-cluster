apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: qbittorrent-config-restic
  namespace: mediastack
spec:
  sourcePVC: pvc-qbittorrent-config
  trigger:
    schedule: "20 1 2-30/2 * *"
  restic:
    pruneIntervalDays: 7
    repository: volsync-qbittorrent-config-restic
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    copyMethod: Clone
    storageClassName: longhorn-r1
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn
