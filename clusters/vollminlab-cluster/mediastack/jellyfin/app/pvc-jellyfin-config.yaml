apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-jellyfin-config
  namespace: mediastack
  labels:
    # Protected by VolSync (offsite-first, restic to B2). Velero FSB skips it via
    # the pvcLabels rule in velero-skip-smb-policy, so it is copied once a night
    # rather than three or four times. Remove this label if VolSync stops
    # covering the volume, or it becomes backed up by nothing.
    backup.vollminlab.com/volsync: "true"
    app: jellyfin
    env: production
    category: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 20Gi -> 30Gi on 2026-10-11: the subtitle warmer's first night filled it to 100%
      # (13 GB of the 14 GB subtitle cache is PGS image subtitles, ~25 MB each). 30Gi was
      # the most two of the three replica disks could schedule with headroom left.
      storage: 30Gi
