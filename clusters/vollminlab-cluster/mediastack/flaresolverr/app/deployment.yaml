apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: mediastack
  labels:
    app: flaresolverr
    env: production
    category: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
        app.kubernetes.io/name: flaresolverr
        env: production
        category: media
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.4.6@sha256:524715c5b5d045ff77ae409ffa1d6c0fcf9f23a2e5e957eb44da4f2fc53e6876
          ports:
            - containerPort: 8191
              name: http
          resources:
            requests:
              cpu: 100m
              # Re-measured 2026-08-19 over 14d: p50 374Mi, p95 412Mi, peak 767.7Mi
              # against the old 768Mi limit -- clipped exactly at the ceiling, and it
              # OOMKilled twice in 30d. The old 192Mi request was also below its own
              # p50, so it was mis-sized in both directions at once. The 'idles at
              # ~0-100Mi' note above was wrong: headless Chromium stays resident.
              memory: 448Mi
            limits:
              cpu: 1000m
              memory: 1Gi
