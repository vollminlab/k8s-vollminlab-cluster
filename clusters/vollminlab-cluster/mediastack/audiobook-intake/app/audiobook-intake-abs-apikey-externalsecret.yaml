apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiobook-intake-abs-apikey
  namespace: mediastack
  labels:
    app: audiobook-intake
    env: production
    category: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-cluster-store
    kind: ClusterSecretStore
  target:
    name: audiobook-intake-abs-apikey
    creationPolicy: Owner
  data:
    # Dedicated Audiobookshelf API key "audiobook-intake" (root user — library
    # scans need admin). Separate from Homepage's key so either can be revoked alone.
    - secretKey: api-key
      remoteRef:
        key: "Audiobookshelf Intake API Key"
        property: api_key
