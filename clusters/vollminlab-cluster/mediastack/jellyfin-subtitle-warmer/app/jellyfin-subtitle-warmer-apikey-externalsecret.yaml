apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-subtitle-warmer-apikey
  namespace: mediastack
  labels:
    app: jellyfin-subtitle-warmer
    env: production
    category: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-cluster-store
    kind: ClusterSecretStore
  target:
    name: jellyfin-subtitle-warmer-apikey
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: "Jellyfin Subtitle Warmer API Key"
        property: api_key
