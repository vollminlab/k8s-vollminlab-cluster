apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-hostpath-batch
policies:
  - ../../../clusters/vollminlab-cluster/kyverno/kyverno/policies/restrict-hostpath-batch.yaml
resources:
  - resources.yaml
results:
  - {policy: restrict-hostpath-usage-batch, rule: disallow-hostpath-except-system-job, kind: Job, resources: [apps/emptydir-job], result: pass}
  - {policy: restrict-hostpath-usage-batch, rule: disallow-hostpath-except-system-job, kind: Job, resources: [apps/hostpath-job], result: fail}
  - {policy: restrict-hostpath-usage-batch, rule: disallow-hostpath-except-system-job, kind: Job, resources: [velero/velero-job], result: skip}
  - {policy: restrict-hostpath-usage-batch, rule: disallow-hostpath-except-system-cronjob, kind: CronJob, resources: [apps/emptydir-cron], result: pass}
  - {policy: restrict-hostpath-usage-batch, rule: disallow-hostpath-except-system-cronjob, kind: CronJob, resources: [apps/hostpath-cron], result: fail}
  - {policy: restrict-hostpath-usage-batch, rule: disallow-hostpath-except-system-cronjob, kind: CronJob, resources: [velero/velero-cron], result: skip}
