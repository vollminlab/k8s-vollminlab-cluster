apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-image-registries
policies:
  - ../../../clusters/vollminlab-cluster/kyverno/kyverno/policies/restrict-image-registries.yaml
resources:
  - resources.yaml
results:
  - {policy: restrict-image-registries, rule: restrict-image-registries-containers, kind: Deployment, resources: [apps/approved, apps/unapproved-init], result: pass}
  - {policy: restrict-image-registries, rule: restrict-image-registries-containers, kind: Deployment, resources: [apps/unapproved], result: fail}
  - {policy: restrict-image-registries, rule: restrict-image-registries-init-containers, kind: Deployment, resources: [apps/approved], result: pass}
  - {policy: restrict-image-registries, rule: restrict-image-registries-init-containers, kind: Deployment, resources: [apps/unapproved-init], result: fail}
