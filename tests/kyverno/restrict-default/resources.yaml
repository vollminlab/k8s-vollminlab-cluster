apiVersion: v1
kind: ConfigMap
metadata: {name: stray, namespace: default}
data: {k: v}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: placed, namespace: apps}
data: {k: v}
---
# Cluster-scoped, so the namespace is fake: the v1.12.1 CLI in the policy-validation
# job puts a namespace-less object in default, which is how the arc-runners
# PriorityClass failed CI. The v1.19.0 CLI here doesn't, so without the explicit
# namespace this fixture passes whether or not PriorityClass is excluded.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: low-priority, namespace: default}
value: -100
