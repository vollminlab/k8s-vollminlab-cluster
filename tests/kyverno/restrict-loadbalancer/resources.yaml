apiVersion: v1
kind: Service
metadata: {name: internal, namespace: apps}
spec:
  type: ClusterIP
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: exposed, namespace: apps}
spec:
  type: LoadBalancer
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: ingress-nginx-controller, namespace: ingress-nginx}
spec:
  type: LoadBalancer
  ports: [{port: 443}]
