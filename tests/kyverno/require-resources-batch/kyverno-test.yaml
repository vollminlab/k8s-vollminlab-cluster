apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-resources-batch
policies:
  - ../../../clusters/vollminlab-cluster/kyverno/kyverno/policies/require-resources-batch.yaml
resources:
  - resources.yaml
results:
  - {policy: require-resources-batch, rule: require-limits-job, kind: Job, resources: [apps/good-job], result: pass}
  - {policy: require-resources-batch, rule: require-limits-job, kind: Job, resources: [apps/no-limit-job], result: fail}
  - {policy: require-resources-batch, rule: require-limits-cronjob, kind: CronJob, resources: [apps/good-cron], result: pass}
  - {policy: require-resources-batch, rule: require-limits-cronjob, kind: CronJob, resources: [apps/no-limit-cron], result: fail}
