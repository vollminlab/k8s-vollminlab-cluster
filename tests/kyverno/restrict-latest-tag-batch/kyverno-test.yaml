apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-latest-tag-batch
policies:
  - ../../../clusters/vollminlab-cluster/kyverno/kyverno/policies/restrict-latest-tag-batch.yaml
resources:
  - resources.yaml
results:
  - {policy: restrict-latest-tag-batch, rule: restrict-latest-tag-job, kind: Job, resources: [apps/pinned-job], result: pass}
  - {policy: restrict-latest-tag-batch, rule: restrict-latest-tag-job, kind: Job, resources: [apps/latest-job], result: fail}
  - {policy: restrict-latest-tag-batch, rule: restrict-latest-tag-cronjob, kind: CronJob, resources: [apps/pinned-cron], result: pass}
  - {policy: restrict-latest-tag-batch, rule: restrict-latest-tag-cronjob, kind: CronJob, resources: [apps/latest-cron], result: fail}
